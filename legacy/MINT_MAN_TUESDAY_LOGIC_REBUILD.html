<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MINT MAN: Tuesday at the Dock</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
#game{image-rendering:pixelated;width:min(100vw,133.33vh);height:auto;aspect-ratio:4/3;background:#000;cursor:crosshair}</style></head>
<body><canvas id="game"></canvas>
<script>
// ---- 01_engine.js ----
'use strict';
// ===== MINT MAN: TUESDAY AT THE DOCK — engine =====
const SW = 320, SH = 240, SCENE_H = 144, SCALE = 3;
const VERBS = ['LOOK', 'TAKE', 'USE', 'TALK', 'OPEN', 'PUSH', 'PULL', 'SCAN', 'GIVE', 'CALL', 'RADIO', 'JUNO'];
const G = { S: null, rooms: {}, items: {}, fast: false, log: [], nextChoices: [], busy: false, hover: null,
  say: null, menuState: null, overlay: null, mouse: { x: 0, y: 0 }, t: 0, fade: 0, snap: null, started: false,
  flash: 0, shake: 0, cardText: null, invPage: 0, cheat: false };
const C = { // palette
  k: '#000000', w: '#f4f4f4', g1: '#c8c8c8', g2: '#8c8c8c', g3: '#5a5a5a', g4: '#2e2e2e',
  r: '#c02828', R: '#ff5a5a', o: '#e08020', y: '#f8e040', Y: '#c8a820', gr: '#28a030', G: '#70e060',
  b: '#2850c0', B: '#60a0f0', c: '#28a0a8', C: '#70e0e0', m: '#a030a0', M: '#f070f0', n: '#7a4a20', N: '#b07840',
  s: '#f0b890', S: '#c88860', d: '#3a2418', vest: '#2a58b8', gray: '#8a8f98', jeans: '#3a5a98', floor: '#9a9a90', floor2: '#8a8a80' };

function newState() {
  return { room: 'break', jx: 120, jy: 122, face: 1, inv: [], f: {}, time: 9 * 60 + 2, act: 1, cat: 1,
    mint: 0, mintOn: false, ax: 100, ay: 124, junoWith: true, pal: {}, verb: null, selItem: null, steps: 0,
    named: {}, biscuitRoom: 'break', torvaldAt: 'yard', tuckerAt: 'floor', prudenceAt: 'lockers', boss: {}, hintLevel: {} };
}
const F = (k) => G.S.f[k];
const setF = (k, v = true) => { G.S.f[k] = v; };
const has = (id) => G.S.inv.includes(id);
const rnd = (seed) => { let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const sleep = (ms) => new Promise(r => setTimeout(r, G.fast ? 0 : ms));
class AbortScript extends Error {}

// ---------- canvas ----------
let cv, ctx;
function initCanvas() {
  cv = document.getElementById('game'); cv.width = SW * SCALE; cv.height = SH * SCALE;
  ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false; G.cv = cv;
  cv.addEventListener('mousemove', e => { G.mouse = mpos(e); G.hover = pickAt(G.mouse.x, G.mouse.y); });
  cv.addEventListener('mousedown', e => { e.preventDefault(); onClick(mpos(e), e.button === 2); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', onKey);
}
function mpos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * SW, y: (e.clientY - r.top) / r.height * SH }; }

// ---------- text ----------
const SPK = { HOLLIS: '#8fd0ff', NARRATOR: '#ffffff', '': '#ffffff', INGRID: '#ffb0d8', BRUNO: '#ffc060', PRUDENCE: '#ff8080', GORDON: '#a0ffa0',
  TUCKER: '#ffff80', OZZIE: '#80e0ff', RUFUS: '#ffa040', TORVALD: '#ffd0a0', HARROW: '#ff70ff', HALVORSEN: '#c0c0ff', TABITHA: '#c0ffe0',
  GUS: '#d0d0d0', RENATA: '#80ffd0', RADIO: '#b0ffb0', PHONE: '#b0ffb0', SCANNER: '#ffe060', JUNO: '#e0b070', SYSTEM: '#ff6060', HR: '#c0ffe0', TABLET: '#c0ffe0' };
function parseLine(l) {
  const m = /^([A-Z][A-Z ]{1,10}): ([\s\S]*)$/.exec(l);
  if (m && SPK[m[1]] !== undefined) return { who: m[1], text: m[2] };
  return { who: 'NARRATOR', text: l };
}
function wrap(text, maxw, font) {
  ctx.font = font; const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width <= maxw) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines;
}
function say(line) { const p = sayImpl(line); G.pend = G.pend || []; G.pend.push(p); if (G.pend.length > 60) G.pend.shift(); return p; }
async function sayImpl(line) {
  if (Array.isArray(line)) { for (const l of line) await say(l); return; }
  const { who, text } = parseLine(line);
  G.log.push(who + ': ' + text); if (G.log.length > 400) G.log.shift();
  if (G.fast) return;
  ctx.save(); ctx.scale(SCALE, SCALE);
  const lines = wrap(text, 292, '7px "Courier New", monospace'); ctx.restore();
  const pages = []; for (let i = 0; i < lines.length; i += 4) pages.push(lines.slice(i, i + 4));
  for (const p of pages) {
    await new Promise(res => { G.say = { who, lines: p, res, t: G.t }; });
    G.say = null;
  }
}
const N = (t) => say(t);
async function run(h) { // run handler: string | array | function
  if (h === undefined || h === null) return;
  if (typeof h === 'string' || Array.isArray(h)) return say(h);
  return h();
}
async function menu(opts, title) { // opts: [text, fn] ; last = exit by convention. returns result of fn
  const vis = opts.filter(o => o);
  let idx;
  if (G.fast) {
    const q = G.nextChoices;
    if (q.length) {
      const want = q.shift(); idx = vis.findIndex(o => (want instanceof RegExp ? want.test(o[0]) : o[0].includes(want)));
      if (idx < 0) { G.choiceErrors = (G.choiceErrors || []); G.choiceErrors.push('no option ' + want + ' in ' + vis.map(o => o[0]).join(' | ')); idx = vis.length - 1; }
    } else idx = vis.length - 1;
  } else {
    idx = await new Promise(res => { G.menuState = { opts: vis, title, res }; });
    G.menuState = null;
  }
  if (idx < 0 || !vis[idx]) return 'timeout';
  return vis[idx][1] ? vis[idx][1]() : undefined;
}
const pickMenu = (title, opts) => menu(opts, title);

// ---------- inventory ----------
function giveItem(id, quiet) {
  if (has(id)) return; G.S.inv.push(id); if (!quiet) { Snd.play('pickup'); }
}
async function take(id, msg) { giveItem(id); if (msg) await say(msg); }
function loseItem(id) { const i = G.S.inv.indexOf(id); if (i >= 0) G.S.inv.splice(i, 1); if (G.S.selItem === id) G.S.selItem = null; }

// ---------- time / acts ----------
const ACT_START = { 1: 9 * 60 + 2, 2: 9 * 60 + 45, 3: 10 * 60 + 15, 4: 10 * 60 + 45, 5: 11 * 60 + 10, 6: 12 * 60 + 3 };
const ACT_CAP = { 1: 9 * 60 + 44, 2: 10 * 60 + 14, 3: 10 * 60 + 44, 4: 11 * 60 + 9, 5: 11 * 60 + 58, 6: 12 * 60 + 20 };
function tick(n = 1) { const S = G.S; S.steps++; S.time = Math.min(S.time + n, ACT_CAP[S.act] || 720); }
function fmtTime(m) { let h = Math.floor(m / 60), mm = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(mm).padStart(2, '0') + ' ' + ap; }
const ACT_NAMES = { 1: 'ACT I — THE BREAK ROOM', 2: 'ACT II — THE DOCK DISASTER', 3: 'ACT III — WHERE DID ALL THESE CATS COME FROM?', 4: 'ACT IV — MINT MODE',
  5: 'ACT V — THE PERFECT SHIPMENT', 6: 'ACT VI — REGIONAL OPERATIONS' };
async function setAct(n, catLevel) {
  const S = G.S; S.act = n; S.time = Math.max(S.time, ACT_START[n]); if (catLevel !== undefined) S.cat = catLevel;
  if (G.fast) return;
  await card(ACT_NAMES[n]);
}
async function card(text, sub) {
  G.cardText = { text, sub, t: G.t }; Snd.play('card'); await sleep(2200); G.cardText = null;
}
async function fade(to, ms = 350) {
  if (G.fast) { G.fade = to; return; }
  const from = G.fade, t0 = performance.now();
  await new Promise(res => { const step = () => { const p = Math.min(1, (performance.now() - t0) / ms); G.fade = from + (to - from) * p; if (p < 1) requestAnimationFrame(step); else res(); }; step(); });
}

// ---------- rooms ----------
const room = () => G.rooms[G.S.room];
async function enterRoom(id, x, y, opts = {}) {
  const S = G.S;
  if (S.room && !opts.noFade) await fade(1, 250);
  S.room = id; const r = G.rooms[id]; S.jx = x !== undefined ? x : (r.start ? r.start[0] : 160); S.jy = y !== undefined ? y : (r.start ? r.start[1] : 122);
  S.ax = S.jx - 16; S.ay = S.jy + 2; G.catCache = {};
  tick(1);
  await fade(0, 250);
  if (r.onEnter) await r.onEnter();
  await checkProgress();
}
function propsNow() {
  const r = room(); const out = [];
  for (const p of r.props || []) { if (p.vis && !p.vis(G.S)) continue; if (p.mintOnly && !G.S.mintOn) continue; out.push(p); }
  return out;
}
function exitsNow() { const r = room(); return (r.exits || []).filter(e => !e.vis || e.vis(G.S)); }

// cats
function catList() {
  const S = G.S, r = room(); if (!r.spots || r.nocats) return [];
  const spots = r.spots; let n;
  const lv = S.cat;
  if (lv <= 0) n = 0; else if (lv === 1) n = Math.min(spots.length, r.c1 || 0);
  else n = Math.min(spots.length, Math.max(r.c1 || 0, Math.ceil(spots.length * [0, 0, 0.22, 0.6, 1][lv])));
  if (F('cats_cleared_' + S.room) && lv >= 2) n = Math.min(n, Math.ceil(n * 0.2));
  const key = S.room + ':' + n; if (G.catCache && G.catCache.key === key) return G.catCache.list;
  const list = []; for (let i = 0; i < n; i++) { const sp = spots[i]; list.push({ x: sp[0], y: sp[1], seed: i * 7 + S.room.length * 13 + (sp[2] || 0), pose: sp[3] }); }
  G.catCache = { key, list }; return list;
}

// ---------- picking ----------
function inRect(x, y, r) { return x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3]; }
function pickAt(x, y) {
  if (y >= SCENE_H) return null;
  const S = G.S; if (!S || !S.room) return null;
  const props = propsNow().slice().sort((a, b) => (b.z || (b.r[1] + b.r[3])) - (a.z || (a.r[1] + a.r[3])));
  // juno
  if (S.junoWith && !room().noJuno && x > S.ax - 10 && x < S.ax + 10 && y > S.ay - 14 && y < S.ay + 2) return { kind: 'juno', name: 'JUNO', obj: null };
  for (const p of props) if (p.npc && inRect(x, y, p.r)) return { kind: 'prop', name: p.name, obj: p };
  for (const c of catList()) if (x >= c.x - 5 && x < c.x + 5 && y >= c.y - 6 && y < c.y + 2) return { kind: 'cat', name: 'CAT', obj: c };
  for (const p of props) if (inRect(x, y, p.r)) return { kind: 'prop', name: p.name, obj: p };
  for (const e of exitsNow()) if (inRect(x, y, e.r)) return { kind: 'exit', name: e.label, obj: e };
  return { kind: 'floor', name: '', obj: null };
}

// ---------- walking ----------
async function walkTo(x, y) {
  const S = G.S, r = room();
  const w = r.walk || [10, 96, 310, 138];
  x = Math.max(w[0], Math.min(w[2], x)); y = Math.max(w[1], Math.min(w[3], y));
  if (G.fast) { S.jx = x; S.jy = y; S.ax = x - 16; S.ay = y + 2; return; }
  G.walkTarget = { x, y };
  await new Promise(res => { G.walkRes = res; });
}
function updateWalk(dt) {
  const S = G.S; if (!S || !S.room) return;
  const wt = G.walkTarget;
  G.walking = false;
  if (wt) {
    const dx = wt.x - S.jx, dy = wt.y - S.jy, d = Math.hypot(dx, dy), sp = 70 * dt;
    if (d <= sp) { S.jx = wt.x; S.jy = wt.y; G.walkTarget = null; if (G.walkRes) { const r = G.walkRes; G.walkRes = null; r(); } }
    else { S.jx += dx / d * sp; S.jy += dy / d * sp; if (Math.abs(dx) > 1) S.face = dx > 0 ? 1 : -1; G.walking = true; }
  }
  // juno follow / animation
  if (S.junoWith && !G.junoScript) {
    const tx = S.jx - S.face * 16, ty = S.jy + 2, dx = tx - S.ax, dy = ty - S.ay, d = Math.hypot(dx, dy);
    G.junoMoving = false;
    if (d > 4) { const sp = Math.min(d * 3, 80) * dt; S.ax += dx / d * sp; S.ay += dy / d * sp; G.junoFace = dx > 0 ? 1 : -1; G.junoMoving = true; }
  }
}
async function junoGo(x, y, pose) { // scripted Juno movement
  const S = G.S; if (G.fast) { S.ax = x; S.ay = y; G.junoPose = pose || null; return; }
  G.junoScript = true; G.junoPose = null;
  await new Promise(res => { G.junoTarget = { x, y, res }; });
  G.junoPose = pose || null; G.junoScript = G.junoScript && !!pose;
}
function updateJuno(dt) {
  const S = G.S, at = G.junoTarget; if (!at) return;
  const dx = at.x - S.ax, dy = at.y - S.ay, d = Math.hypot(dx, dy), sp = 95 * dt; G.junoMoving = true;
  if (d <= sp) { S.ax = at.x; S.ay = at.y; G.junoTarget = null; G.junoMoving = false; at.res(); } else { S.ax += dx / d * sp; S.ay += dy / d * sp; G.junoFace = dx > 0 ? 1 : -1; }
}
async function junoAnim(pose, ms = 900) { G.junoPose = pose; if (pose === 'bark') Snd.play('bark'); await sleep(ms); G.junoPose = null; }
function junoFree() { G.junoScript = false; G.junoPose = null; }

// ---------- actions ----------
const DEFAULT_NO = {
  TAKE: ['Hollis has taken enough things that were not his today. He declines.', 'It is bolted down, in a way that suggests someone else has already tried.', 'Taking that would create paperwork. Hollis is at capacity.'],
  OPEN: ['It does not open. Or it does, and nothing interesting happens.', 'Hollis checks. It is as open as it is going to get.'],
  PUSH: ['Hollis pushes. It stays. The warehouse wins again.', 'Pushing it would only relocate the problem.'],
  PULL: ['Hollis pulls. Nothing. The universe declines the transaction.', 'It does not budge. It has clearly been there longer than Hollis has.'],
  TALK: ['Hollis talks to it. It has no comment at this time.', 'A conversation with that would be one-sided, even by warehouse standards.'],
  GIVE: ['That is not a recipient.', 'It does not want anything from Hollis. Rare.'],
  USE: ['Hollis cannot think of a productive use for that. Or a safe one.', 'Using that would be a procedure. There is no procedure.'],
  SCAN: ['SCANNER: No barcode found. Item reclassified as "Miscellaneous Thing".', 'SCANNER: Beep. Nothing. The scanner does not care either.'],
  LOOK: ['It looks like it belongs here.', 'Hollis has seen it a thousand times. It has not improved.'],
  JUNO: ['Juno looks at it, then at Hollis. She has no notes.', 'Juno sniffs. It smells like warehouse. Everything does.']
};
const pickRand = (a, s) => a[Math.floor(rnd(s || G.S.steps + 1) * a.length)];
const WRONG_USE = ['Hollis has operated enough equipment without authorization today.', 'That combination is not in any training module. Possibly for good reason.',
  'Hollis considers it, then considers the incident report. Hard pass.', 'Nothing happens. The narrator is relieved.', 'That would work in a world with fewer rules. This is not that world.'];

async function walkToTarget(t) {
  const S = G.S;
  if (t.kind === 'prop') { const p = t.obj; const st = p.stand || [p.r[0] + p.r[2] / 2, Math.min(p.r[1] + p.r[3] + 3, 136)]; await walkTo(st[0], st[1]); if (p.r[0] + p.r[2] / 2 !== S.jx) S.face = (p.r[0] + p.r[2] / 2) > S.jx ? 1 : -1; }
  else if (t.kind === 'cat') { await walkTo(t.obj.x - 12, t.obj.y + 4); S.face = 1; }
  else if (t.kind === 'exit') { const e = t.obj; await walkTo(e.stand ? e.stand[0] : e.r[0] + e.r[2] / 2, e.stand ? e.stand[1] : Math.min(e.r[1] + e.r[3], 130)); }
}

async function perform(verb, itemId, t) {
  if (G.busy) return; G.busy = true;
  const S = G.S; G.snap = JSON.stringify(S);
  try {
    S.verb = null; S.selItem = null;
    tick(1);
    await doVerb(verb, itemId, t);
  } catch (e) { if (!(e instanceof AbortScript)) { console.error(e); G.errors = (G.errors || []); G.errors.push(String(e && e.stack || e)); } }
  finally { G.walkTarget = null; junoFree(); G.junoTarget = null; try { await checkProgress(); } catch (e) { if (!(e instanceof AbortScript)) { console.error(e); G.errors = (G.errors || []); G.errors.push(String(e && e.stack || e)); } } finally { G.busy = false; safePoint(); } }
}

async function doVerb(verb, itemId, t) {
  const S = G.S;
  if (verb === 'CALL') return G.story.callMenu();
  if (verb === 'RADIO') return G.story.radioMenu();
  if (t.kind === 'floor') return;
  if (t.kind === 'exit') {
    if (verb === 'LOOK') { return say(t.obj.look || 'An exit. Hollis has used it before.'); }
    await walkToTarget(t); return goExit(t.obj);
  }
  // inventory-item target
  if (t.kind === 'item') return G.story.itemVerb(verb, itemId, t.obj);
  await walkToTarget(t);
  if (t.kind === 'juno') return G.story.junoVerb(verb, itemId);
  if (t.kind === 'cat') return G.story.catVerb(verb, itemId, t.obj);
  const p = t.obj;
  if (verb === 'USE' && itemId) {
    const h = p.useOn && (p.useOn[itemId] !== undefined ? p.useOn[itemId] : p.useOn['*']);
    if (h !== undefined) return run(h);
    return say(G.story.wrongUse(itemId, p));
  }
  if (verb === 'GIVE') {
    if (!itemId) return say('Hollis needs to pick something to give first.');
    const h = p.giveTo && (p.giveTo[itemId] !== undefined ? p.giveTo[itemId] : p.giveTo['*']);
    if (h !== undefined) return run(h);
    return say(G.story.smart('GIVE', p, itemId));
  }
  if (verb === 'SCAN') {
    if (!(await G.story.scannerOk())) return;
    if (p.scan !== undefined) return run(p.scan);
    return say(pickRand(DEFAULT_NO.SCAN));
  }
  if (verb === 'JUNO' && p.juno !== undefined && p.juno !== null) return run(p.juno);
  const h = p.on && p.on[verb];
  if (h !== undefined) return run(h);
  if (verb === 'LOOK' && p.look) return run(p.look);
  if (verb === 'TALK' && p.npc) return say(p.name + ' has nothing to say to Hollis right now.');
  return say(G.story.smart(verb, p));
}

async function goExit(e) {
  if (e.lock) { G.pend = []; const locked = e.lock(G.S); await Promise.all(G.pend); if (locked) return; }
  const to = G.rooms[e.to];
  await enterRoom(e.to, e.enter ? e.enter[0] : undefined, e.enter ? e.enter[1] : undefined);
}

// ---------- input ----------
const verbBtns = VERBS.map((v, i) => ({ v, r: [6 + (i % 6) * 52, 152 + Math.floor(i / 6) * 14, 50, 12] }));
const INV_SLOT = { x0: 6, y0: 191, w: 38, h: 22, cols: 8, rows: 2 };
function invRect(i) { return [INV_SLOT.x0 + (i % INV_SLOT.cols) * (INV_SLOT.w + 1), INV_SLOT.y0 + Math.floor(i / INV_SLOT.cols) * (INV_SLOT.h + 1), INV_SLOT.w, INV_SLOT.h]; }
const perPage = INV_SLOT.cols * INV_SLOT.rows - 0;
function invIndexAt(x, y) {
  const inv = G.S.inv; const off = G.invPage * (perPage - 1); const per = inv.length > perPage ? perPage - 1 : perPage;
  for (let i = 0; i < per; i++) { if (inRect(x, y, invRect(i))) { const idx = off + i; if (idx < inv.length) return idx; } }
  return -1;
}
function onKey(e) {
  if (!G.started) { if (G.title) G.title.key(e); return; }
  if (e.key === 'F5') { e.preventDefault(); if (G.started) { if (saveGame()) toast('SAVED'); else toast('WILL SAVE WHEN THIS FINISHES'); } return; }
  if (G.overlay && G.overlay.key) return G.overlay.key(e);
  if (G.menuState) { const n = parseInt(e.key); if (n >= 1 && n <= G.menuState.opts.length) G.menuState.res(n - 1); return; }
  if (G.say) { if (e.key === ' ' || e.key === 'Enter') { const r = G.say.res; G.say = null; r(); } return; }
  if (e.key === 'h' || e.key === 'H') { if (!G.busy) G.story.hint(); }
  if (e.key === 't' || e.key === 'T') { if (!G.busy && G.story.todo) G.story.todo(); }
  if (e.key === 'm' || e.key === 'M') { if (G.S.mint > 0) { G.S.mintOn = !G.S.mintOn; Snd.play('beep'); } }
  if (e.key === 'n' || e.key === 'N') Snd.toggleMusic();
  if (e.key === 'Escape') { G.S.verb = null; G.S.selItem = null; }
  if (!G.busy) { const n = parseInt(e.key, 10); if (n >= 1 && n <= 9) { G.S.verb = VERBS[n - 1]; } if (e.key === '0') G.S.verb = VERBS[9]; if (e.key === '-') G.S.verb = VERBS[10]; if (e.key === '=') G.S.verb = VERBS[11]; }
}
async function onClick(p, right) {
  Snd.unlock();
  if (!G.started) { if (G.title) G.title.click(p); return; }
  if (G.overlay && G.overlay.click) return G.overlay.click(p);
  if (G.menuState) {
    const ms = G.menuState; const y0 = SCENE_H + 8;
    ms.opts.forEach((o, i) => { if (p.y >= y0 + i * 10 && p.y < y0 + i * 10 + 10) ms.res(i); }); return;
  }
  if (G.say) { const r = G.say.res; G.say = null; r(); return; }
  if (G.busy) return;
  const S = G.S;
  if (p.y >= SCENE_H) {
    for (const b of verbBtns) if (inRect(p.x, p.y, b.r)) { S.verb = b.v; S.selItem = null; Snd.play('click'); if (b.v === 'CALL' || b.v === 'RADIO') perform(b.v, null, { kind: 'floor' }); return; }
    if (!G.busy && inRect(p.x, p.y, [230, 180, 90, 10]) && G.story.todo) { G.story.todo(); return; }
    // inventory pages

'use strict';
// ===== WebAudio synth: all sounds and music are generated =====
const Snd = {
  ac: null, master: null, music: true, mtimer: null, step: 0,
  unlock() { if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; } try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; this.ac = new A(); this.master = this.ac.createGain(); this.master.gain.value = 0.35; this.master.connect(this.ac.destination); if (this.music) this.startMusic(); } catch (e) {} },
  tone(f, d, type = 'square', vol = 0.2, when = 0, slide = 0) { const a = this.ac; if (!a) return; const t = a.currentTime + when; const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.02); },
  noise(d, vol = 0.2, when = 0, hp = 0) { const a = this.ac; if (!a) return; const t = a.currentTime + when; const n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = a.createBufferSource(); s.buffer = b; const g = a.createGain(); g.gain.value = vol; let node = s; if (hp) { const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; s.connect(f); node = f; } node.connect(g); g.connect(this.master); s.start(t); },
  play(name) {
    if (!this.ac || G.fast) return; const T = (...a) => this.tone(...a), Ns = (...a) => this.noise(...a);
    switch (name) {
      case 'click': T(880, .04, 'square', .1); break;
      case 'beep': T(1800, .08, 'square', .15); break;
      case 'scan': T(2200, .06, 'square', .15); T(2900, .08, 'square', .15, .07); break;
      case 'scanfail': T(300, .2, 'sawtooth', .15); T(200, .3, 'sawtooth', .15, .15); break;
      case 'pickup': T(660, .07, 'square', .15); T(990, .1, 'square', .15, .07); break;
      case 'reverse': for (let i = 0; i < 4; i++) T(1000, .18, 'square', .1, i * .4); break;
      case 'dock': Ns(.5, .25, 0); T(90, .4, 'sawtooth', .2, 0, -40); break;
      case 'bump': Ns(.2, .4); T(60, .3, 'sine', .4, 0, -30); break;
      case 'pallet': Ns(.15, .2, 0, 800); T(150, .1, 'square', .1); break;
      case 'printer': for (let i = 0; i < 10; i++) Ns(.05, .15, i * .07, 2000); break;
      case 'radio': T(1200, .06, 'square', .12); T(900, .06, 'square', .12, .08); break;
      case 'buzz': T(120, .6, 'sawtooth', .1); T(122, .6, 'sawtooth', .1); break;
      case 'vend': Ns(.3, .2, 0, 500); T(200, .2, 'square', .15, .2); T(150, .3, 'square', .15, .4); break;
      case 'bark': T(400, .08, 'sawtooth', .25, 0, -150); T(380, .1, 'sawtooth', .25, .13, -150); break;
      case 'meow': { const f = 500 + Math.random() * 300; T(f, .3, 'triangle', .18, 0, 250); T(f + 250, .25, 'triangle', .12, .1, -350); break; }
      case 'meows': for (let i = 0; i < 24; i++) { const f = 400 + Math.random() * 500; T(f, .35, 'triangle', .07, Math.random() * .8, 250); } break;
      case 'card': [392, 523, 659, 784].forEach((f, i) => T(f, .3, 'square', .12, i * .12)); break;
      case 'mint': for (let i = 0; i < 14; i++) T(300 + i * 90, .15, 'sine', .14, i * .06); T(1600, 1, 'sawtooth', .1, .9, 800); Ns(.8, .15, .5, 3000); break;
      case 'fail': [300, 250, 200, 140].forEach((f, i) => T(f, .3, 'sawtooth', .16, i * .2)); break;
      case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => T(f, .2, 'square', .14, i * .11)); break;
      case 'kpi': T(700, .05, 'square', .1); T(500, .07, 'square', .1, .06); break;
    }
  },
  startMusic() { if (this.mtimer || !this.ac) return; const bass = [55, 55, 82, 55, 73, 73, 82, 65], mel = [0, 330, 0, 392, 440, 0, 392, 330, 0, 294, 0, 330, 392, 0, 330, 0];
    this.mtimer = setInterval(() => { if (!this.music || !this.ac) return; const i = this.step++ % 16; if (i % 2 === 0) this.tone(bass[(i / 2) % 8], .22, 'triangle', .13); if (mel[i]) this.tone(mel[i] * (G.S && G.S.mintOn ? 1.5 : 1), .16, 'square', .04); if (i % 4 === 0) this.noise(.03, .05, 0, 6000); }, 210); },
  toggleMusic() { this.music = !this.music; if (this.music) this.startMusic(); }
};

async function terminalMenu() {

  await menu([
    ['TRAILERS', async () => { await say(['WMS: T-4417 — INBOUND, DOOR 2, 8 loads, status: RECONCILED.', 'WMS: T-4418 — INBOUND, DOOR 6, 8 loads, status: RECONCILED.', ].concat(F('departed') ? ['WMS: T-9022 — DEPARTED 11:59, 8 loads, seal 88120.', 'NARRATOR: For once, the computer and the parking lot agree.'] : F('t9022_at_dock') ? ['WMS: T-9022 — OUTBOUND, DOOR 3, status: READY.', 'NARRATOR: For once, it is.'] : ['WMS: T-9022 — OUTBOUND, DOOR 3, EMPTY, status: READY.', 'NARRATOR: There is an empty trailer at door 3 in the computer. There is not one at door 3 in real life. The computer is completely sure.'])); setF('sys_t9022'); }],
    ['ASSETS', async () => { await say((F('swap_fixed') ? ['WMS: F-2231 — CUSHION-TIRE — location: HERE.', 'WMS: RT-77 — REACH TRUCK — location: REMOTE SITE.', 'NARRATOR: The screen and the floor finally agree.'] : ['WMS: F-2231 — PROPANE SIT-DOWN — location: TENNESSEE.', 'WMS: RT-77 — CUSHION-TIRE — location: REMOTE SITE.', 'WMS: LOADS A3, A4 — REACH TRUCKS — dest: NEBRASKA (per Directive 7-C).', 'NARRATOR: Nothing on the screen agrees with anything outside it.'])); setF('rec_read'); }],
    ['DIRECTIVES (LOCKED)', async () => { await say(['WMS: ACCESS LEVEL REQUIRED: ADMIN.', 'WMS: Hint: "HALO engineering password (original)."']); setF('saw_admin_lock'); }],
    ['Log out', null]], 'WMS (GUEST)');

async function terminalSwap() {
  if (!F('rec_read')) return say('Hollis has a vague sense he should read the records before rewriting them. That is the kind of discipline that comes with experience.');
  if (F('swap_fixed')) return say('The terminal already agrees with reality. It seems to be holding its breath.');
  if (!F('admin_pw')) { setF('saw_admin_lock'); return say('The terminal wants an ADMIN password to change asset identities. Its install hint says "HALO engineering password (original)". Hollis has none. He suspects someone who is technically not employed here does.'); }
  if (!F('ozzie_plate')) return say('Hollis has the serials from Tucker\'s notebook, but the system\'s claim about the remote site should be confirmed by someone standing next to that reach truck. Ozzie, maybe.');
  await say('Hollis logs in as admin (using a password he was not supposed to be told). He opens the identity table. RT-77 is carrying F-2231\'s cushion-tire spec, and F-2231 has been handed a propane spec and a Tennessee address off Directive 7-C. Tucker\'s notebook has the original plates and serials for both.');
  await menu([['RESTORE identities: F-2231 and RT-77 (from Tucker\'s notebook)', async () => { setF('swap_fixed'); Snd.play('printer'); await say(['WMS: Identities restored. F-2231: CUSHION-TIRE (HERE). RT-77: REACH TRUCK (REMOTE SITE).', 'NARRATOR: Somewhere, two pieces of equipment are handed back the personalities they had all along.', 'INGRID: ...Did you just fix that?', 'HOLLIS: I found the notebook.', 'INGRID: Whose?', 'HOLLIS: Tucker\'s.', 'INGRID: (very long pause) ...Huh.']); }], ['Do not merge anything yet', null]], 'ADMIN: ASSET IDENTITIES');
}

  await say('Hollis holds up the hydraulic seal kit. Bruno\'s eyes go wide, then narrow, then wide.');
  await say('BRUNO: Is that an H-17? Where did you find that? I\'ve been asking Parts for that seal since March. (He stops.) Nobody\'s in Parts. (He starts again.) Who let you into Parts?');

  await say('BRUNO: Don\'t tell me. Actually, do tell me.'); await say('Bruno drops to a knee and works the seal into the jack. It fizzes, then hums. The jack rises. It lowers. It rises again. The puddle stops.');
  setF('bruno_jack_fixed'); loseItem('seal'); setF('bruno_legend_offer'); await say('BRUNO: She\'s alive. (He pats it.) Here — keep it. You\'ll need it more than me. I\'ve got another one, older, meaner. As for my dots — you were wondering, right?');

  G.overlay = null; G.S = Object.assign(newState(), JSON.parse(S0)); G.catCache = {}; G.walkTarget = null; throw new AbortScript();
}

      if (pair === 'form7q+pen') { if (F('form_filled')) return say('The form is already filled.'); setF('form_filled'); return say('Hollis fills out Form 7-Q. Name: Hollis. Reason: "Hot shipment (see: everything)". "How this will create work for others": "It won\'t." (This is a lie.) It needs a signature from Operations.'); }
      if (pair === 'kibble+bowl') return say('Hollis considers refilling the bowls. He does not. That is how this started.');

};
