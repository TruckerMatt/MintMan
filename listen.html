RUNO", "v": "Rich - Southern US", "sc": "outbound", "t": "I don't load a pallet with a cat on it. It's a rule. It's my rule. It's a good one.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_4bbfd18ddd.mp3", "d": 5.3, "fl": [], "q": 175, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_745249572a", "s": "BRUNO", "v": "Rich - Southern US", "sc": "outbound", "t": "One pallet in staging has twelve on it. Warm. I'm not touching that until they choose to leave.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_745249572a.mp3", "d": 6.6, "fl": [], "q": 176, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_56755b98cb", "s": "BRUNO", "v": "Rich - Southern US", "sc": "outbound", "t": "Halvorsen says Regional says the dashboard is right. Regional says Halvorsen says the same. It's a nice circle. I stay out of it. I load trucks.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_56755b98cb.mp3", "d": 9.8, "fl": [], "q": 177, "ch": "normal", "p": "", "si": 0}, {"id": "vo_halvorsen_fcba5ff068", "s": "HALVORSEN", "v": "Will", "sc": "outbound", "t": "It... it left on time. I'm going to go sit down. On the floor. For a minute.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_fcba5ff068.mp3", "d": 6.0, "fl": [], "q": 178, "ch": "radio", "p": "", "si": 0}, {"id": "vo_rufus_96553e7fad", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "Not now. I'm counting.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_96553e7fad.mp3", "d": 2.2, "fl": [], "q": 179, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_0a60d28e64", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "Cats. I started counting trailers this morning, and I got to the cats. Now I can't stop.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_0a60d28e64.mp3", "d": 6.7, "fl": [], "q": 180, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_42a6abe903", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "I know where every trailer is. Every single one. But I can't tell you without my clicker. Lost it Thursday. I'm off count without it.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_42a6abe903.mp3", "d": 9.8, "fl": [], "q": 181, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_452a79d448", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "Row C, spot 9. Out past the fuel island. When you need it at the dock, radio me from the outbound dock. I need eyes at the door: a spotter to tell me when it's clear.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_452a79d448.mp3", "d": 11.9, "fl": [], "q": 182, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_ce94acc78a", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "It's gone. 11:59. I drove it to the gate myself. That's one trailer I don't have to count.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_ce94acc78a.mp3", "d": 7.5, "fl": [], "q": 183, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_d9f3610ee9", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "It's at door 3. I put it there. Don't let anybody move it.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_d9f3610ee9.mp3", "d": 4.8, "fl": [], "q": 184, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_e6a761e8cd", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "The WMS says 12 trailers in the yard. I see 41. The WMS is very optimistic about emptiness.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_e6a761e8cd.mp3", "d": 9.1, "fl": [], "q": 185, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_87d4a1451d", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "Trailer 31? The empty, heated one? For the cats?", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_87d4a1451d.mp3", "d": 4.5, "fl": [], "q": 186, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_c62414a92b", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "I've been hoping somebody would do something with it.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_c62414a92b.mp3", "d": 3.0, "fl": [], "q": 187, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_dd467a4ffb", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "I'd love to. Just as soon as you find my clicker.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_dd467a4ffb.mp3", "d": 3.6, "fl": [], "q": 188, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_2e09e9a78b", "s": "PRUDENCE", "v": "Jessica", "sc": "drain", "t": "Oh, put it down, please. I would rather not be technically in possession. I don't want to be technically in possession.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_2e09e9a78b.mp3", "d": 7.6, "fl": [], "q": 189, "ch": "normal", "p": "", "si": 0}, {"id": "vo_scanner_76b3db342e", "s": "SCANNER", "v": "Vector - Tec Voice", "sc": "suite", "t": "Attempting to scan a person as a metric... Result: 100.0%. Confidence: 100.0%. Note: this device is now on a Performance Improvement Plan.", "tt": "", "f": "assets/audio/voice/scanner/vo_scanner_76b3db342e.mp3", "d": 14.0, "fl": [], "q": 190, "ch": "normal", "p": "", "si": 0}, {"id": "vo_scanner_e012518ab5", "s": "SCANNER", "v": "Vector - Tec Voice", "sc": "suite", "t": "CONSTANCE HARROW — Regional Director. Reading... reading...", "tt": "", "f": "assets/audio/voice/scanner/vo_scanner_e012518ab5.mp3", "d": 5.1, "fl": [], "q": 191, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_26aa4b8a17", "s": "HOLLIS", "v": "James (cloned)", "sc": "finale", "t": "—was reported by a dashboard.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_26aa4b8a17.mp3", "d": 2.0, "fl": [], "q": 192, "ch": "normal", "p": "", "si": 0}, {"id": "vo_harrow_917aa67517", "s": "HARROW", "v": "Lily", "sc": "finale", "t": "That's not... the dashboard doesn't...", "tt": "", "f": "assets/audio/voice/harrow/vo_harrow_917aa67517.mp3", "d": 3.2, "fl": [], "q": 193, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_633692bb75", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "A prompt blinks: \"ENTER GROUND TRUTH REFERENCE.\" Hollis pulls out the crumpled label from his pocket. It says \"TEST TEST TEST — T.\" Its barcode has never scanned. Now it glows.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_633692bb75.mp3", "d": 14.5, "fl": [], "q": 194, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_4e0705cb8f", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "What does that mean, in shipping language?", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_4e0705cb8f.mp3", "d": 2.8, "fl": [], "q": 195, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_76f22c4e53", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "Hollis! Gordon, Kestrel Motor Works, production manager. Your customer. Finally. Are we shipping? Line three has been down since 7. I have forty guys standing around holding air.", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_76f22c4e53.mp3", "d": 12.4, "fl": [], "q": 196, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_c04b37ec92", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "Good.", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_c04b37ec92.mp3", "d": 0.8, "fl": [], "q": 197, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_f35522b13d", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "Where is it?", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_f35522b13d.mp3", "d": 1.0, "fl": [], "q": 198, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_55041d77fd", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "Cats.", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_55041d77fd.mp3", "d": 0.9, "fl": [], "q": 199, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_62bb289abf", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "How many is \"some\"?", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_62bb289abf.mp3", "d": 2.0, "fl": [], "q": 200, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_c4f26e3dd1", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "Okay. Okay. What do you need from me?", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_c4f26e3dd1.mp3", "d": 3.1, "fl": [], "q": 201, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_76f41ea6ff", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "We don't even sell those. Why would I want a reach truck?", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_76f41ea6ff.mp3", "d": 3.6, "fl": [], "q": 202, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gordon_6944bb35ab", "s": "GORDON", "v": "Adam", "sc": "phone", "t": "The system also has our Ohio freight going to Tennessee, apparently. That's not a labeling problem, that's a sickness.", "tt": "", "f": "assets/audio/voice/gordon/vo_gordon_6944bb35ab.mp3", "d": 7.7, "fl": [], "q": 203, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_32dcf69495", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "There's a reach truck in my yard. The WMS says it's a cushion-tire called RT-77. It has a very specific opinion about being a forklift.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_32dcf69495.mp3", "d": 9.6, "fl": [], "q": 204, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_409a24a575", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "Hollis! It's Ozzie, remote site. That is the little overflow yard we lease, two hundred miles from anything. What do you need?", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_409a24a575.mp3", "d": 7.7, "fl": [], "q": 205, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_9dab37f31a", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "Cats? No. A crow. It has been standing on the reach truck since Friday. I would say it is management-adjacent.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_9dab37f31a.mp3", "d": 8.5, "fl": [], "q": 206, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_b2139fe401", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "Still none. A crow looked at the reach truck for a while. I think it was auditing.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_b2139fe401.mp3", "d": 5.1, "fl": [], "q": 207, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_662e72baae", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "Thank you. I check it every hour.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_662e72baae.mp3", "d": 2.5, "fl": [], "q": 208, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_d10806fe54", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "It is turkey. It is the only thing at this site with a confirmed location.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_d10806fe54.mp3", "d": 4.7, "fl": [], "q": 209, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_a5b9e44f12", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "So the computer mixed them up.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_a5b9e44f12.mp3", "d": 2.0, "fl": [], "q": 210, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_aea26d12c6", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "Like a bad movie.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_aea26d12c6.mp3", "d": 1.7, "fl": [], "q": 211, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ozzie_d96568c86e", "s": "OZZIE", "v": "Topher", "sc": "phone", "t": "The WMS is wrong. This is not a cushion-tire. This is an RT-anything.", "tt": "", "f": "assets/audio/voice/ozzie/vo_ozzie_d96568c86e.mp3", "d": 5.8, "fl": [], "q": 212, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_37948788ce", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "phone", "t": "Okay. Where are they living? What are they eating? And is there a safe place we can take them?", "tt": "", "f": "assets/audio/voice/renata/vo_renata_37948788ce.mp3", "d": 6.2, "fl": [], "q": 213, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_7d2dd3e77a", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "phone", "t": "How many?", "tt": "", "f": "assets/audio/voice/renata/vo_renata_7d2dd3e77a.mp3", "d": 0.9, "fl": [], "q": 214, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_208c4909c8", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "phone", "t": "Call me when you know why they're there. If we can't fix the source, they'll come back. I can take them. But the pallet has to go.", "tt": "", "f": "assets/audio/voice/renata/vo_renata_208c4909c8.mp3", "d": 8.0, "fl": [], "q": 215, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_02cb5cd2dd", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "phone", "t": "You already did.", "tt": "", "f": "assets/audio/voice/renata/vo_renata_02cb5cd2dd.mp3", "d": 1.6, "fl": [], "q": 216, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_58d26e0ff6", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "phone", "t": "That works. We'll bring vans. Get them fed and calm and moving in a line. Put kibble along the route. Have someone they trust call the leader. I'll be at the gate.", "tt": "", "f": "assets/audio/voice/renata/vo_renata_58d26e0ff6.mp3", "d": 10.3, "fl": [], "q": 217, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_58946b54cf", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis logs in as admin (using a password he was not supposed to be told). He opens the identity table. RT-77 is carrying F-2231's cushion-tire spec, and F-2231 has been handed a propane spec and a Tennessee address off Directive 7-C. Tucker's notebook has the original plates and serials for both.", "tt": "Hollis logs in as admin. He opens the identity table. RT-77 is carrying F-2231's cushion-tire spec, and F-2231 has been handed a propane spec and a Tennessee address off Directive 7-C. Tucker's notebook has the original plates and serials for both.", "f": "assets/audio/voice/narrator/vo_narrator_58946b54cf.mp3", "d": 22.1, "fl": [], "q": 218, "ch": "normal", "p": "", "si": 0}, {"id": "vo_tucker_7d33e70e89", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "Hollis! You saved me! I'd have been in there until lunch. Or Wednesday.", "tt": "", "f": "assets/audio/voice/tucker/vo_tucker_7d33e70e89.mp3", "d": 6.0, "fl": [], "q": 219, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_14daaeb9eb", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Technicality.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_14daaeb9eb.mp3", "d": 1.1, "fl": [], "q": 220, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_b85ecf7481", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Oh! Hollis. Hi. I was just finishing something. Eleven years in Inventory Control, you know. They never did make a form for my exit.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_b85ecf7481.mp3", "d": 9.2, "fl": [], "q": 221, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_022548cf84", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Honestly? Still finishing something. Can't stop now.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_022548cf84.mp3", "d": 3.7, "fl": [], "q": 222, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_1966c559d1", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "A technicality. Paperwork. The work itself is still happening.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_1966c559d1.mp3", "d": 4.8, "fl": [], "q": 223, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_4c98cdbd0b", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "It was a process. It hasn't concluded.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_4c98cdbd0b.mp3", "d": 3.2, "fl": [], "q": 224, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_a0cfbfed45", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Colleagues.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_a0cfbfed45.mp3", "d": 1.1, "fl": [], "q": 225, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_bcee717e1f", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "I'd trade it for something. I have friends who'd appreciate something salty. Fish-shaped, ideally. From that vending machine.", "tt": "", "f": "assets/audio/voice/prudence/vo_prudence_bcee717e1f.mp3", "d": 7.2, "fl": [], "q": 226, "ch": "normal", "p": "", "si": 0}, {"id": "vo_tucker_8f29a60608", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "Was she? She's everywhere. Anyway! How can I help? I'm great at helping.", "tt": "", "f": "assets/audio/voice/tucker/vo_tucker_8f29a60608.mp3", "d": 6.6, "fl": [], "q": 227, "ch": "normal", "p": "", "si": 0}, {"id": "vo_tucker_7955cdbad1", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "You're not mad?", "tt": "", "f": "assets/audio/voice/tucker/vo_tucker_7955cdbad1.mp3", "d": 1.5, "fl": [], "q": 228, "ch": "normal", "p": "", "si": 0}, {"id": "vo_torvald_adb7696237", "s": "TORVALD", "v": "Brian", "sc": "multiple", "t": "The cats? They've been camping by the drain since spring. Ask Prudence. She'll say she doesn't know. She's lying beautifully.", "tt": "", "f": "assets/audio/voice/torvald/vo_torvald_adb7696237.mp3", "d": 8.3, "fl": [], "q": 229, "ch": "normal", "p": "", "si": 0}, {"id": "vo_torvald_ba722687b8", "s": "TORVALD", "v": "Brian", "sc": "multiple", "t": "Halvorsen is always asking where people are. Where's that ever gotten him?", "tt": "", "f": "assets/audio/voice/torvald/vo_torvald_ba722687b8.mp3", "d": 4.5, "fl": [], "q": 230, "ch": "normal", "p": "", "si": 0}, {"id": "vo_torvald_ccca2c7354", "s": "TORVALD", "v": "Brian", "sc": "multiple", "t": "You found me. Impressive. Tell no one. I'm the dock spotter. I spot. That is the job.", "tt": "", "f": "assets/audio/voice/torvald/vo_torvald_ccca2c7354.mp3", "d": 7.2, "fl": [], "q": 231, "ch": "normal", "p": "", "si": 0}, {"id": "vo_tabitha_37043d43f3", "s": "TABITHA", "v": "Hollie Sue", "sc": "multiple", "t": "Cats are a learning opportunity! With paperwork.", "tt": "", "f": "assets/audio/voice/tabitha/vo_tabitha_37043d43f3.mp3", "d": 3.4, "fl": [], "q": 232, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gus_ab8a6b0401", "s": "GUS", "v": "Bill", "sc": "multiple", "t": "Then no. Regional rules. I can't bend those. I'm pretty sure that's the only rule I'm allowed to know.", "tt": "", "f": "assets/audio/voice/gus/vo_gus_ab8a6b0401.mp3", "d": 7.7, "fl": [], "q": 233, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gus_148e6d05ef", "s": "GUS", "v": "Bill", "sc": "multiple", "t": "Great. Then it's a loop.", "tt": "", "f": "assets/audio/voice/gus/vo_gus_148e6d05ef.mp3", "d": 1.8, "fl": [], "q": 234, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gus_444c44914f", "s": "GUS", "v": "Bill", "sc": "multiple", "t": "Prudence? I'm aware Prudence is present. Yes. We've all been aware. Security has determined this is an Operations matter.", "tt": "", "f": "assets/audio/voice/gus/vo_gus_444c44914f.mp3", "d": 9.2, "fl": [], "q": 235, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gus_636cb68f22", "s": "GUS", "v": "Bill", "sc": "multiple", "t": "I have eight monitors. Six of them have cats on them. I've made my peace.", "tt": "", "f": "assets/audio/voice/gus/vo_gus_636cb68f22.mp3", "d": 5.6, "fl": [], "q": 236, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gus_ff59f1aade", "s": "GUS", "v": "Bill", "sc": "multiple", "t": "I don't know that word. What word is that?", "tt": "", "f": "assets/audio/voice/gus/vo_gus_ff59f1aade.mp3", "d": 3.0, "fl": [], "q": 237, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_ba36fd85ca", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "multiple", "t": "You must be Hollis. I'm Renata. This is the largest colony I've ever been called to. And the best-organized.", "tt": "", "f": "assets/audio/voice/renata/vo_renata_ba36fd85ca.mp3", "d": 7.8, "fl": [], "q": 238, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_eed9e425c5", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "multiple", "t": "I'll put \"volunteer\".", "tt": "", "f": "assets/audio/voice/renata/vo_renata_eed9e425c5.mp3", "d": 2.0, "fl": [], "q": 239, "ch": "normal", "p": "", "si": 0}, {"id": "vo_renata_895cb0447b", "s": "RENATA", "v": "Hollie - Kind, Enthusiastic", "sc": "multiple", "t": "The last few, the ones who like the office, can stay if they want. They've got seniority.", "tt": "", "f": "assets/audio/voice/renata/vo_renata_895cb0447b.mp3", "d": 5.7, "fl": [], "q": 240, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_fc0bcb6cce", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Orange dot: mine, ships. Blue dot: stays inside. No dot: I didn't touch it — cat or label. Kestrel's PO tells you the rest.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_fc0bcb6cce.mp3", "d": 10.5, "fl": [], "q": 241, "ch": "radio", "p": "", "si": 0}, {"id": "vo_rufus_6109bb342e", "s": "RUFUS", "v": "Callum", "sc": "multiple", "t": "I'd love to talk, but I'm off count without my clicker. It's... somewhere lost.", "tt": "", "f": "assets/audio/voice/rufus/vo_rufus_6109bb342e.mp3", "d": 6.3, "fl": [], "q": 242, "ch": "radio", "p": "", "si": 0}, {"id": "vo_narrator_1bcbc424b6", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "INVENTORY ACCURACY: 100%. Load B5: REACH TRUCK CHARGERS — shipped to Nebraska Monday. Confidence: total.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1bcbc424b6.mp3", "d": 10.8, "fl": [], "q": 243, "ch": "normal", "p": "", "si": 0}, {"id": "vo_scanner_0cd4db191d", "s": "SCANNER", "v": "Vector - Tec Voice", "sc": "mgmt", "t": "GUS — Vigilance: 100% (for the right things). Aware of: Prudence (yes), cats (yes), Conveyor 9 (no comment).", "tt": "GUS — Vigilance: 100%, for the right things. Aware of: Prudence, yes, cats, yes, Conveyor 9, no comment.", "f": "assets/audio/voice/scanner/vo_scanner_0cd4db191d.mp3", "d": 11.8, "fl": [], "q": 244, "ch": "normal", "p": "", "si": 0}, {"id": "vo_scanner_e81091ec1b", "s": "SCANNER", "v": "Vector - Tec Voice", "sc": "mgmt", "t": "BADGE READER — Access: REGIONAL. Your access: \"hah\".", "tt": "", "f": "assets/audio/voice/scanner/vo_scanner_e81091ec1b.mp3", "d": 5.1, "fl": [], "q": 245, "ch": "normal", "p": "", "si": 0}, {"id": "vo_gus_604dbdc5e2", "s": "GUS", "v": "Bill", "sc": "multiple", "t": "I don't accept gifts. The last one had a cat in it.", "tt": "", "f": "assets/audio/voice/gus/vo_gus_604dbdc5e2.mp3", "d": 3.7, "fl": [], "q": 246, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_7fa0996eef", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The HALO wall lights up like a slot machine. KPIs cascade across the screen. Trailer assignments rewrite themselves. Labels print uncontrollably from the ceiling vents. The scanner in Hollis's pocket beeps eleven times and rewrites its own logs. Staging lanes, somewhere below, reassign themselves. On the radio, three contradictory instructions arrive at once.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_7fa0996eef.mp3", "d": 26.2, "fl": [], "q": 247, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d6f554200d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Hollis perceives every pallet. Every trailer. Every serial number. Every destination. Every staging lane. Every production order. Every scanner record. Every misplaced forklift. Every missing manifest. Every cat: all two hundred and fourteen, plus the few who chose to stay.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d6f554200d.mp3", "d": 21.4, "fl": [], "q": 248, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_656b9de08d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The dashboard begins to change. 100% becomes 8 of 8 shipped. 100% becomes 8 of 8 stored. Staging: 0. Cats: 214 (fed, safe, judgmental). T-9022: departed 11:59. F-2231: cushion-tire, here. RT-77: reach truck, remote. Every number is small, specific, and true.", "tt": "The dashboard begins to change. 100% becomes 8 of 8 shipped. 100% becomes 8 of 8 stored. Staging: 0. Cats: 214, fed, safe, judgmental. T-9022: departed 11:59. F-2231: cushion-tire, here. RT-77: reach truck, remote. Every number is small, specific, and true.", "f": "assets/audio/voice/narrator/vo_narrator_656b9de08d.mp3", "d": 32.1, "fl": [], "q": 249, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3795e71aab", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "A crumpled shipping label. On the front: a barcode, and in Tucker's handwriting, \"TEST TEST TEST — T.\" On the back, in pencil: \"LKR 114: 33-12-08 (borrowed your combo, sorry! —T)\".", "tt": "A crumpled shipping label. On the front: a barcode, and in Tucker's handwriting, \"TEST TEST TEST — T.\" On the back, in pencil: \"LKR 114: 33-12-08, borrowed your combo, sorry! —T\".", "f": "assets/audio/voice/narrator/vo_narrator_3795e71aab.mp3", "d": 19.0, "fl": [], "q": 250, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_78e92dae5d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "The whiteboard. \"HOT SHIPMENT (rush order: the customer is losing money every hour) — KESTREL MOTOR WORKS — 8 LOADS (eight pallets of parts) — OUT BY 12:00 (NOON). NO EXCEPTIONS.\" Under it, someone has written \"CATS: \" and then nothing, as if the marker died in the attempt.", "tt": "The whiteboard. \"HOT SHIPMENT, rush order: the customer is losing money every hour — KESTREL MOTOR WORKS — 8 LOADS, eight pallets of parts — OUT BY 12:00, NOON. NO EXCEPTIONS.\" Under it, someone has written \"CATS: \" and then nothing, as if the marker died in the attempt.", "f": "assets/audio/voice/narrator/vo_narrator_78e92dae5d.mp3", "d": 20.8, "fl": [], "q": 251, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_f0c8d6b52a", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "You have it? (She stares at the paw print.) That's the only accurate document in the building. Put a note on it.", "tt": "You have it? That's the only accurate document in the building. Put a note on it.", "f": "assets/audio/voice/ingrid/vo_ingrid_f0c8d6b52a.mp3", "d": 5.3, "fl": [], "q": 252, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_045723a2ba", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "Page 1. Page 2. Decoded lines. Fixed identities. Sorted staging. (She smiles, tiredly.) I think we can make a true bill of lading.", "tt": "Page 1. Page 2. Decoded lines. Fixed identities. Sorted staging. I think we can make a true bill of lading.", "f": "assets/audio/voice/ingrid/vo_ingrid_045723a2ba.mp3", "d": 9.6, "fl": [], "q": 253, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_6ad41bef35", "s": "BRUNO", "v": "Rich - Southern US", "sc": "outbound", "t": "Staging clear, trailer at the door, cats off my pallets. Simple. (He looks at the pallets.) Sorting is your part. Loading is mine.", "tt": "Staging clear, trailer at the door, cats off my pallets. Simple. Sorting is your part. Loading is mine.", "f": "assets/audio/voice/bruno/vo_bruno_6ad41bef35.mp3", "d": 7.6, "fl": [], "q": 254, "ch": "normal", "p": "", "si": 0}, {"id": "vo_rufus_218c477a1c", "s": "RUFUS", "v": "Callum", "sc": "yard", "t": "A lot. (He clicks.) More now.", "tt": "A lot. More now.", "f": "assets/audio/voice/rufus/vo_rufus_218c477a1c.mp3", "d": 2.2, "fl": [], "q": 255, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c84ffbb92f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "TUCKER'S BOOK OF NUMBERS (PRIVATE). Each page: a forklift plate, a serial, a date, and a doodle. Page 14: \"F-2231 — cushion tire — CT-2231 — first week — (doodle of a smiling forklift)\". Page 15: \"RT-77 — REACH — first week, later — (doodle of a sad reach truck going away)\".", "tt": "TUCKER'S BOOK OF NUMBERS, PRIVATE. Each page: a forklift plate, a serial, a date, and a doodle. Page 14: \"F-2231 — cushion tire — CT-2231 — first week —, doodle of a smiling forklift\". Page 15: \"RT-77 — REACH — first week, later —, doodle of a sad reach truck going away\".", "f": "assets/audio/voice/narrator/vo_narrator_c84ffbb92f.mp3", "d": 29.3, "fl": [], "q": 256, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_40a1f34078", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Page 2 of the T-4417 manifest, with a paw print and a small nibble in one corner. It lists lines 5 through 8. Line 5: \"MAST ASSEMBLIES (3-STAGE)\". Lines 6 and 7: \"FELINE NUTRITION, BULK TOTES (PAWSOME FOODS) — STORE, DO NOT SHIP\". Line 8: \"OVERHEAD GUARD KITS.\"", "tt": "Page 2 of the T-4417 manifest, with a paw print and a small nibble in one corner. It lists lines 5 through 8. Line 5: \"MAST ASSEMBLIES, 3-STAGE\". Lines 6 and 7: \"FELINE NUTRITION, BULK TOTES, PAWSOME FOODS — STORE, DO NOT SHIP\". Line 8: \"OVERHEAD GUARD KITS.\"", "f": "assets/audio/voice/narrator/vo_narrator_40a1f34078.mp3", "d": 25.5, "fl": [], "q": 257, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c0a80ef2c1", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "It is a Tuesday. It is humid. It is going to get worse. (Controls: pick a verb, then click a thing. Right-click LOOKs. Enter types a command. Press H for a hint. Juno is your dog; the JUNO verb sends her to sniff or fetch.)", "tt": "It is a Tuesday. It is humid. It is going to get worse.", "f": "assets/audio/voice/narrator/vo_narrator_c0a80ef2c1.mp3", "d": 4.7, "fl": [], "q": 258, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_925d25b0b1", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Is that an H-17? Where did you find that? I've been asking Parts for that seal since March. (He stops.) Nobody's in Parts. (He starts again.) Who let you into Parts?", "tt": "Is that an H-17? Where did you find that? I've been asking Parts for that seal since March. Nobody's in Parts. Who let you into Parts?", "f": "assets/audio/voice/bruno/vo_bruno_925d25b0b1.mp3", "d": 9.1, "fl": [], "q": 259, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_fa63dbb20c", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "I don't work anywhere. (She digs in a pocket.) I am, however, a keyholder in a personal, unofficial capacity.", "tt": "I don't work anywhere. I am, however, a keyholder in a personal, unofficial capacity.", "f": "assets/audio/voice/prudence/vo_prudence_fa63dbb20c.mp3", "d": 6.3, "fl": [], "q": 260, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_8f6a68039c", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Cats? What cats. (She sips.) I think you'd have better luck asking someone who's been spending time by the drain. (She looks at nothing.)", "tt": "Cats? What cats. I think you'd have better luck asking someone who's been spending time by the drain.", "f": "assets/audio/voice/prudence/vo_prudence_8f6a68039c.mp3", "d": 6.1, "fl": [], "q": 261, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_84f7f64731", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Because nobody knows it. (She smiles.) Except me. And the tech. And now you. It's unauthorized information. Very unofficial.", "tt": "Because nobody knows it. Except me. And the tech. And now you. It's unauthorized information. Very unofficial.", "f": "assets/audio/voice/prudence/vo_prudence_84f7f64731.mp3", "d": 9.1, "fl": [], "q": 262, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_be6e731dce", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Oh, that. (She strolls to the dock kiosk.) It's just a rule with a password that's supposed to belong to Regional.", "tt": "Oh, that. It's just a rule with a password that's supposed to belong to Regional.", "f": "assets/audio/voice/prudence/vo_prudence_be6e731dce.mp3", "d": 5.3, "fl": [], "q": 263, "ch": "normal", "p": "", "si": 0}, {"id": "vo_prudence_fd578e1252", "s": "PRUDENCE", "v": "Jessica", "sc": "multiple", "t": "Oh, you didn't have to. (She takes them.) Fine. Here. The last decent coffee. But you didn't get it from me.", "tt": "Oh, you didn't have to. Fine. Here. The last decent coffee. But you didn't get it from me.", "f": "assets/audio/voice/prudence/vo_prudence_fd578e1252.mp3", "d": 7.4, "fl": [], "q": 264, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_89434f98c0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The game saves itself as you go. (F5 also saves.) The warehouse does not.", "tt": "The game saves itself as you go. The warehouse does not.", "f": "assets/audio/voice/narrator/vo_narrator_89434f98c0.mp3", "d": 4.3, "fl": [], "q": 265, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6bc084f8a2", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "KESTREL MOTOR WORKS — PO 55-1187 — HOT. Lines: 1) CUSHION-TIRE FORKLIFT ×2 (CT-118, CT-119). 2) MAST ASSEMBLY (3-STAGE). 3) OVERHEAD GUARD KIT. 4) 48V BATTERY PACK. 5) HYDRAULIC HOSE KIT. 6) CONTROL HARNESS CRATE. 7) COUNTERWEIGHT BLOCKS (IRON). That is eight loads. Nothing else. No reach trucks. No tires. No cat food.", "tt": "KESTREL MOTOR WORKS — PO 55-1187 — HOT. Lines: 1) CUSHION-TIRE FORKLIFT ×2, CT-118, CT-119. 2) MAST ASSEMBLY, 3-STAGE. 3) OVERHEAD GUARD KIT. 4) 48V BATTERY PACK. 5) HYDRAULIC HOSE KIT. 6) CONTROL HARNESS CRATE. 7) COUNTERWEIGHT BLOCKS, IRON. That is eight loads. Nothing else. No reach trucks. No tires. No cat food.", "f": "assets/audio/voice/narrator/vo_narrator_6bc084f8a2.mp3", "d": 36.4, "fl": [], "q": 266, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_17e480e8fd", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "A grease-stained spiral notebook: \"SMOKE LOG\". Entries: \"FRI 4:07 AM — HALO printer prints by itself. Label kiosk approves own directive. Says 'thank you' out loud. Time: 4:07. Note: nobody was there but me and a cat.\" Signed: TORVALD. (Witness.)", "tt": "A grease-stained spiral notebook: \"SMOKE LOG\". Entries: \"FRI 4:07 AM — HALO printer prints by itself. Label kiosk approves own directive. Says 'thank you' out loud. Time: 4:07. Note: nobody was there but me and a cat.\" Signed: TORVALD. Witness.", "f": "assets/audio/voice/narrator/vo_narrator_17e480e8fd.mp3", "d": 22.8, "fl": [], "q": 267, "ch": "normal", "p": "", "si": 0}, {"id": "vo_tucker_97c10c37b2", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "Oh, for me?! (He takes it. He looks at it. He looks up.) What is it for?", "tt": "Oh, for me?! What is it for?", "f": "assets/audio/voice/tucker/vo_tucker_97c10c37b2.mp3", "d": 2.8, "fl": [], "q": 268, "ch": "normal", "p": "", "si": 0}, {"id": "vo_halvorsen_83213cc72b", "s": "HALVORSEN", "v": "Will", "sc": "multiple", "t": "I am not a metric. (glances at dashboard) Am I?", "tt": "I am not a metric. Am I?", "f": "assets/audio/voice/halvorsen/vo_halvorsen_83213cc72b.mp3", "d": 2.7, "fl": [], "q": 269, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_c294887d26", "s": "INGRID", "v": "Matilda", "sc": "outbound", "t": "I know. I just printed it.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_c294887d26.mp3", "d": 2.1, "fl": [], "q": 270, "ch": "radio", "p": "Ingrid, we're sealed. (Ingrid, on the radio: \"I know. I just printed it.\") Rufus, take her out.", "si": 2}, {"id": "vo_hollis_93fdf6351d", "s": "HOLLIS", "v": "James (cloned)", "sc": "mgmt", "t": "It's an approved form.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_93fdf6351d.mp3", "d": 1.6, "fl": [], "q": 271, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0aece5e494", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "mgmt", "t": "Gus glances at the corridor, then at the ceiling, then at a security monitor showing Rack 14.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0aece5e494.mp3", "d": 7.3, "fl": [], "q": 272, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4d31c55c31", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "mgmt", "t": "The reader stays red. Gus doesn't move. The only other way in is not through Gus.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4d31c55c31.mp3", "d": 7.1, "fl": [], "q": 273, "ch": "normal", "p": "", "si": 0}, {"id": "vo_scanner_0a9d0c0931", "s": "SCANNER", "v": "Vector - Tec Voice", "sc": "suite", "t": "ERROR. SUBJECT DETECTED AS \"KPI\". Please rephrase as a physical object.", "tt": "", "f": "assets/audio/voice/scanner/vo_scanner_0a9d0c0931.mp3", "d": 6.5, "fl": [], "q": 274, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_08aa88ee63", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "There is no leaving during a Regional Review. It is in the calendar.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_08aa88ee63.mp3", "d": 4.4, "fl": [], "q": 275, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_aa52d7a248", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "There is no leaving during a Regional Review.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_aa52d7a248.mp3", "d": 3.2, "fl": [], "q": 276, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d95ced64f7", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The trailer backs six feet, corrects itself, and returns to the yard with dignity.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d95ced64f7.mp3", "d": 5.6, "fl": [], "q": 277, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_aba07fb8b0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Rufus eases the trailer forward.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_aba07fb8b0.mp3", "d": 2.4, "fl": [], "q": 278, "ch": "normal", "p": "Rufus eases the trailer forward. TORVALD: NO, THE LIGHT. Rufus brakes. Torvald scoops a cat out of the path of the front tire and sets it, with dignity, somewhere safer.", "si": 1}, {"id": "vo_narrator_c625acebdc", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Rufus brakes. Torvald scoops a cat out of the path of the front tire and sets it, with dignity, somewhere safer.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c625acebdc.mp3", "d": 8.1, "fl": [], "q": 279, "ch": "normal", "p": "Rufus eases the trailer forward. TORVALD: NO, THE LIGHT. Rufus brakes. Torvald scoops a cat out of the path of the front tire and sets it, with dignity, somewhere safer.", "si": 3}, {"id": "vo_narrator_aa29398460", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "T-9022 eases into Door 3. The dock plate falls with a satisfying clang. The light is green. The computer, for the first time in a week, is correct. It has no idea why.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_aa29398460.mp3", "d": 14.4, "fl": [], "q": 280, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e1c2cdf3fa", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The dashboard redefines a metric while Hollis hesitates. Reality frays at the edges.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e1c2cdf3fa.mp3", "d": 6.6, "fl": [], "q": 281, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_f00868b287", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "HALO rewrites the records faster than Hollis can read. The numbers reset. He inhales. He tries again.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f00868b287.mp3", "d": 8.1, "fl": [], "q": 282, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_adca41b969", "s": "HOLLIS", "v": "James (cloned)", "sc": "finale", "t": "I took the scenic route.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_adca41b969.mp3", "d": 1.6, "fl": [], "q": 283, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_85433e264a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Constance Harrow stands at the head of the conference table, tablet in hand. Behind her, the HALO wall shines with a serene, perfect, all-green light. Juno sits beside Hollis. Juno's armband glows faintly.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_85433e264a.mp3", "d": 15.8, "fl": [], "q": 284, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_38c48bdbb5", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The suite hums. Somewhere, a fan starts.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_38c48bdbb5.mp3", "d": 4.0, "fl": [], "q": 285, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d9504a57b2", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The walls of the suite begin to shudder. Labels flutter down from the ceiling. The HALO wall reassigns something with a tiny, cheerful ding.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d9504a57b2.mp3", "d": 9.6, "fl": [], "q": 286, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_af2913f77e", "s": "HOLLIS", "v": "James (cloned)", "sc": "finale", "t": "The dashboard is wrong.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_af2913f77e.mp3", "d": 1.6, "fl": [], "q": 287, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_32caebb537", "s": "HOLLIS", "v": "James (cloned)", "sc": "finale", "t": "It's going to rewrite the building.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_32caebb537.mp3", "d": 2.4, "fl": [], "q": 288, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e52221202e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Cats appear on the conference table. On the HALO wall. On Harrow's tablet. One sits on the \"SUBMIT\" button.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e52221202e.mp3", "d": 8.0, "fl": [], "q": 289, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_52858f23e5", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "MINT MODE: MAXIMUM.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_52858f23e5.mp3", "d": 2.2, "fl": [], "q": 290, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_77def68b66", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Hollis has one more resource. A second mint? No. He has a mint's worth of faith in the world being solid. The glow inside him climbs past what the mint was ever meant to hold.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_77def68b66.mp3", "d": 13.0, "fl": [], "q": 291, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_a8bbb47e84", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "TOTAL LOGISTICS AWARENESS.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_a8bbb47e84.mp3", "d": 2.4, "fl": [], "q": 292, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e4b6b21d67", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "It runs through him like a river of freight. For a few seconds, he understands the entire supply chain. It is enormous. It is stupid. It is beautiful.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e4b6b21d67.mp3", "d": 12.0, "fl": [], "q": 293, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_96a2f36bd0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The false records strike red and vanish, one by one. The true records glow green and settle back into place. The suite goes very quiet.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_96a2f36bd0.mp3", "d": 11.0, "fl": [], "q": 294, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6bf8c80eb5", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Hollis turns to the HALO terminal at the side of the table. There is a login. He has a password from somebody who technically doesn't work here, and a crumpled label that has been in his pocket since 9:02.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6bf8c80eb5.mp3", "d": 13.2, "fl": [], "q": 295, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_cf8fee74d9", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Hollis remembers he has a bigger task, and puts the scanner away.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_cf8fee74d9.mp3", "d": 4.2, "fl": [], "q": 296, "ch": "normal", "p": "", "si": 0}, {"id": "vo_harrow_edd1a6bf25", "s": "HARROW", "v": "Lily", "sc": "finale", "t": "Whatever you are about to do, Hollis, do it.", "tt": "", "f": "assets/audio/voice/harrow/vo_harrow_edd1a6bf25.mp3", "d": 3.5, "fl": [], "q": 297, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b8db9c6e4f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The terminal waits. Harrow waits. A cat on the table waits, with the most patience.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_b8db9c6e4f.mp3", "d": 6.8, "fl": [], "q": 298, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_7962277500", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "ACCESS DENIED. Hollis has no password for this terminal.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_7962277500.mp3", "d": 4.3, "fl": [], "q": 299, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8700bed9ac", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The terminal accepts it with the calm of an old friend. \"WELCOME BACK, INSTALL TECH.\"", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_8700bed9ac.mp3", "d": 5.8, "fl": [], "q": 300, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_930bb4bff4", "s": "HOLLIS", "v": "James (cloned)", "sc": "finale", "t": "Template 000. Tucker printed it by accident. It's the only record HALO never rewrote.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_930bb4bff4.mp3", "d": 7.2, "fl": [], "q": 301, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_647ea6eefa", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Hollis hesitates. The wall still says 100% about everything. Harrow is watching the wall, not him.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_647ea6eefa.mp3", "d": 8.4, "fl": [], "q": 302, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6ba9c36431", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The prompt keeps blinking. The dashboard behind it is still lying. Nothing is fixed until the label goes in.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6ba9c36431.mp3", "d": 7.5, "fl": [], "q": 303, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_44231da513", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The cats sit down. The labels stop. The suite's lights stop flickering.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_44231da513.mp3", "d": 5.6, "fl": [], "q": 304, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_f9438e0a7b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "The optic reader chirps. The HALO wall goes black for one full second. Then, in white text on a plain field: \"GROUND TRUTH REFERENCE ACCEPTED. RECONCILING TO PHYSICAL.\"", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f9438e0a7b.mp3", "d": 12.7, "fl": [], "q": 305, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8f900bf3f1", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "Hollis pats his pockets. He has nothing the optic reader would recognise as ground truth.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_8f900bf3f1.mp3", "d": 5.7, "fl": [], "q": 306, "ch": "normal", "p": "", "si": 0}, {"id": "vo_harrow_26ccfbe32a", "s": "HARROW", "v": "Lily", "sc": "finale", "t": "I'm not asking you.", "tt": "", "f": "assets/audio/voice/harrow/vo_harrow_26ccfbe32a.mp3", "d": 1.6, "fl": [], "q": 307, "ch": "normal", "p": "", "si": 0}, {"id": "vo_harrow_328d628688", "s": "HARROW", "v": "Lily", "sc": "finale", "t": "I'm suspending Directive 7-C, the Metric Harmonization Initiative, and the automatic approvals. Physical verification will be a standing line item. Someone will have to do it.", "tt": "", "f": "assets/audio/voice/harrow/vo_harrow_328d628688.mp3", "d": 12.2, "fl": [], "q": 308, "ch": "normal", "p": "", "si": 0}, {"id": "vo_harrow_fec99232b1", "s": "HARROW", "v": "Lily", "sc": "finale", "t": "I was managing numbers. I thought the numbers were the warehouse.", "tt": "", "f": "assets/audio/voice/harrow/vo_harrow_fec99232b1.mp3", "d": 4.4, "fl": [], "q": 309, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_9b9d2bf8b1", "s": "HOLLIS", "v": "James (cloned)", "sc": "finale", "t": "The warehouse never stopped being right. It was just underreported.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_9b9d2bf8b1.mp3", "d": 4.5, "fl": [], "q": 310, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_936ec65635", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "finale", "t": "She glances at Hollis. Hollis glances at the door.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_936ec65635.mp3", "d": 3.9, "fl": [], "q": 311, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_4fbc82c5da", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "I don't load pallets with a cat on it. Or twelve. I have a policy.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_4fbc82c5da.mp3", "d": 4.8, "fl": [], "q": 312, "ch": "radio", "p": "", "si": 0}, {"id": "vo_halvorsen_6bac8d4c3c", "s": "HALVORSEN", "v": "Will", "sc": "multiple", "t": "Also, Hollis, it's come to my attention there may be a few cats. There is no approved metric for cats. So there aren't any.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_6bac8d4c3c.mp3", "d": 8.8, "fl": [], "q": 313, "ch": "radio", "p": "Halvorsen on the radio: \"Also, Hollis, it's come to my attention there may be a few cats. There is no approved metric for cats. So there aren't any.\"", "si": 2}, {"id": "vo_halvorsen_4b4318d450", "s": "HALVORSEN", "v": "Will", "sc": "multiple", "t": "There's no cat problem, I'm told. Please disregard the cat on the forklift.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_4b4318d450.mp3", "d": 4.8, "fl": [], "q": 314, "ch": "radio", "p": "", "si": 0}, {"id": "vo_ingrid_c3b222f546", "s": "INGRID", "v": "Matilda", "sc": "multiple", "t": "The WMS just released the reconciliation hold on staging. Every pallet is now movable. It's the first thing the WMS has done all week.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_c3b222f546.mp3", "d": 9.9, "fl": [], "q": 315, "ch": "radio", "p": "", "si": 0}, {"id": "vo_torvald_630bc42ac4", "s": "TORVALD", "v": "Brian", "sc": "multiple", "t": "I'll be there. I'll be the guy standing exactly where I'm supposed to be. Don't make it weird.", "tt": "", "f": "assets/audio/voice/torvald/vo_torvald_630bc42ac4.mp3", "d": 5.5, "fl": [], "q": 316, "ch": "radio", "p": "", "si": 0}, {"id": "vo_halvorsen_22586de4d5", "s": "HALVORSEN", "v": "Will", "sc": "multiple", "t": "Yes. Is it the shipment? It's always the shipment. Fine. Keep going. Did you check the dashboard? It's green.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_22586de4d5.mp3", "d": 8.1, "fl": [], "q": 317, "ch": "phone", "p": "", "si": 0}, {"id": "vo_halvorsen_2c573dc194", "s": "HALVORSEN", "v": "Will", "sc": "multiple", "t": "Yes? Is it the shipment? Fine. Also, if you see cats: they aren't there.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_2c573dc194.mp3", "d": 6.3, "fl": [], "q": 318, "ch": "radio", "p": "", "si": 0}, {"id": "vo_halvorsen_d6fa9d3be2", "s": "HALVORSEN", "v": "Will", "sc": "multiple", "t": "Status? Give me a number. Any number. I'll take a green one.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_d6fa9d3be2.mp3", "d": 4.0, "fl": [], "q": 319, "ch": "radio", "p": "", "si": 0}, {"id": "vo_bruno_1639bfc5f1", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Eight to Kestrel. Right eight. I'm eating lunch.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_1639bfc5f1.mp3", "d": 3.6, "fl": [], "q": 320, "ch": "radio", "p": "", "si": 0}, {"id": "vo_bruno_85265a9a3f", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Trailer at the door and I'll load. I need to see it. You know where to find me.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_85265a9a3f.mp3", "d": 4.4, "fl": [], "q": 321, "ch": "radio", "p": "", "si": 0}, {"id": "vo_bruno_95e543828f", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Find me an H-17 seal for this jack, then we talk.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_95e543828f.mp3", "d": 3.9, "fl": [], "q": 322, "ch": "radio", "p": "", "si": 0}, {"id": "vo_ingrid_5b42d31cbf", "s": "INGRID", "v": "Matilda", "sc": "multiple", "t": "Come to my desk. The radio is for emergencies. Everything is a small emergency, but this isn't one.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_5b42d31cbf.mp3", "d": 7.5, "fl": [], "q": 323, "ch": "radio", "p": "", "si": 0}, {"id": "vo_tucker_4b66bca0e8", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "Hollis! You're calling ME? I'm great! What can I help with? I'm holding a pallet. A different one. I'm fine.", "tt": "", "f": "assets/audio/voice/tucker/vo_tucker_4b66bca0e8.mp3", "d": 8.0, "fl": [], "q": 324, "ch": "radio", "p": "", "si": 0}, {"id": "vo_tucker_7cc08f68c4", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "Hollis! I'm in the cage! It's cozy! The key is in Parts somewhere! Probably!", "tt": "", "f": "assets/audio/voice/tucker/vo_tucker_7cc08f68c4.mp3", "d": 6.2, "fl": [], "q": 325, "ch": "radio", "p": "", "si": 0}, {"id": "vo_tucker_ce9c118777", "s": "TUCKER", "v": "Jordan - Warm & Gritty", "sc": "multiple", "t": "I'm holding the door! I'm not moving! Is it working?", "tt": "", "f": "assets/audio/voice/tucker/vo_tucker_ce9c118777.mp3", "d": 4.1, "fl": [], "q": 326, "ch": "radio", "p": "", "si": 0}, {"id": "vo_narrator_38c0a69d20", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "TRAILER LOCATION ACCURACY: 100%. T-9022 was at Door 3 all morning, per HALO.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_38c0a69d20.mp3", "d": 8.6, "fl": [], "q": 327, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_354207fd30", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "DOCUMENT ACCURACY: 100%. Bills of lading auto-verified. Manifest for T-4417: complete.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_354207fd30.mp3", "d": 10.0, "fl": [], "q": 328, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4de25caaa5", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "IDENTITY INTEGRITY: 100%. F-2231 is a propane sit-down forklift. Location: Tennessee. The serial history is immutable.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4de25caaa5.mp3", "d": 12.5, "fl": [], "q": 329, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_670d8e884d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "REMOTE-SITE VARIANCE: 0.0%. Ozzie's site: all freight reconciled. No swaps.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_670d8e884d.mp3", "d": 8.2, "fl": [], "q": 330, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_95102ff375", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "suite", "t": "PRODUCTION FULFILLMENT: 100%. Kestrel Motor Works: satisfied. Line 3: operational.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_95102ff375.mp3", "d": 8.3, "fl": [], "q": 331, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_86e5832c05", "s": "HOLLIS", "v": "James (cloned)", "sc": "multiple", "t": "Prudence. HALO's admin login. Do you happen to know it?", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_86e5832c05.mp3", "d": 4.1, "fl": [], "q": 332, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_2486b9d1ea", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "WHISKER RIDGE CAT RESCUE. \"Found a cat? Found 40? Found 200? Call Renata: 555-0142. We bring vans. We bring volunteers. We bring blankets. You bring a safe place and something to eat.\"", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_2486b9d1ea.mp3", "d": 17.4, "fl": [], "q": 333, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_66990fe60d", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "Also, here. Guest login for the WMS terminal: read-only. Don't break it. And here are the phone numbers: Gordon at Kestrel. Ozzie at the remote site. They're both very... available.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_66990fe60d.mp3", "d": 15.2, "fl": [], "q": 334, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_9c8504a428", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "Page 2. Lines 5 through 8. If it turns up... I'd prefer it wasn't chewed. It was last on a cat. I'm told the cat is orange, and answers to a rank.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_9c8504a428.mp3", "d": 12.6, "fl": [], "q": 335, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_97740ef80a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "Below the directive, another line — the identity swap. Below THAT, a metric labeled \"Cats\" pointing at nothing at all.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_97740ef80a.mp3", "d": 8.8, "fl": [], "q": 336, "ch": "normal", "p": "", "si": 0}, {"id": "vo_halvorsen_3a5fc25124", "s": "HALVORSEN", "v": "Will", "sc": "ops", "t": "Hollis. She takes the reviews seriously. Bring... everything.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_3a5fc25124.mp3", "d": 5.3, "fl": [], "q": 337, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_20d309422e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "Rows and rows of small parts bins labeled with codes only the Parts Department understands (and, at night, the Parts Department's ghost). One label reads \"H-17 — HYDRAULIC SEALS, PALLET JACK, MISC\".", "tt": "Rows and rows of small parts bins labeled with codes only the Parts Department understands, and, at night, the Parts Department's ghost. One label reads \"H-17 — HYDRAULIC SEALS, PALLET JACK, MISC\".", "f": "
