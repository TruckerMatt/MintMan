tares at it like a man who has forgotten his own PIN, because he has.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_aaf817687c.mp3", "d": 8.6, "fl": [], "q": 427, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d566975509", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "Locker 114. Yours, in theory. The padlock hangs open, and the dent still looks intentional.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d566975509.mp3", "d": 8.3, "fl": [], "q": 428, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_dd02cc88b8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "Locker 114. Yours, in theory. It has a combination padlock and a dent that looks intentional.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_dd02cc88b8.mp3", "d": 8.2, "fl": [], "q": 429, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0db602860b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "Already open. Nothing else in there but pine-scented resignation.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0db602860b.mp3", "d": 4.8, "fl": [], "q": 430, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b20b0f8b59", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "Inside: seven hi-vis vests, a thermos, a sleeping bag, and a single work glove that smells strongly of tobacco and pine.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_b20b0f8b59.mp3", "d": 9.5, "fl": [], "q": 431, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1746969345", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "Just splinters.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1746969345.mp3", "d": 1.6, "fl": [], "q": 432, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_61cfe5b0e0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "A quarter has been lodged in the seam.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_61cfe5b0e0.mp3", "d": 2.6, "fl": [], "q": 433, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8159dcad20", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "A long bench with worn boot scuffs.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_8159dcad20.mp3", "d": 2.9, "fl": [], "q": 434, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c1aa6b6f26", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "Hollis pries a quarter out of the seam with a fingernail. Modest, but real.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c1aa6b6f26.mp3", "d": 5.3, "fl": [], "q": 435, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_571683ba1d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "The box is now \"Found & Lost\". Hollis feels good about that.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_571683ba1d.mp3", "d": 4.8, "fl": [], "q": 436, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c4f7433424", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "The Lost & Found box. It contains a single boot, a Bluetooth speaker that plays only static, and a folded pink blanket that has clearly been thoroughly loved. A tally counter peeks from underneath.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c4f7433424.mp3", "d": 13.9, "fl": [], "q": 437, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d10638a0f0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "The Lost & Found box. A single boot and a Bluetooth speaker that plays only static. The blanket and the tally counter are gone.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d10638a0f0.mp3", "d": 10.0, "fl": [], "q": 438, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_493016ce1f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "lockers", "t": "The HR door is closed. A sticky note: \"Back at 9:02.\" It has been 9:02 in HR for about a year.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_493016ce1f.mp3", "d": 8.4, "fl": [], "q": 439, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_a4f730fe94", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "A cushion-tire forklift, unmistakable to anyone who has ever touched one: solid tires, low seat, no propane tank, a dent in the guard that Hollis has personal history with. The plate says F-2231.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_a4f730fe94.mp3", "d": 16.8, "fl": [], "q": 440, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_5d5dc14c2b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "The warehouse computer says this forklift is currently in Tennessee.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_5d5dc14c2b.mp3", "d": 4.5, "fl": [], "q": 441, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_75b74bfc0d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "The computer remains confident.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_75b74bfc0d.mp3", "d": 2.3, "fl": [], "q": 442, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_63eeea9b4e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "The HALO regional dashboard, mounted on the wall like a saint. Every bar is green. Every number is 100%. Below it, a cat is sitting on a shelf, indifferent to metrics.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_63eeea9b4e.mp3", "d": 13.9, "fl": [], "q": 443, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_eb055e5fb8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "It has never once been correct and has never once been red.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_eb055e5fb8.mp3", "d": 4.5, "fl": [], "q": 444, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_12188aff1c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "Someone has added \"OUT 11:59\" in green, with a tick.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_12188aff1c.mp3", "d": 4.8, "fl": [], "q": 445, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_698c21371a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "Hollis takes the bowl. A dozen cats stare. One of them says something rude in cat.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_698c21371a.mp3", "d": 6.5, "fl": [], "q": 446, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_9a077e562f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "floor", "t": "Tucker's pallet wall blocks the aisle to the staging lanes. It would take a small army, or one person who understands the difference between \"organized\" and \"obstructed\".", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_9a077e562f.mp3", "d": 11.0, "fl": [], "q": 447, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_93dcf5773c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "The trailer assignment board. Door 3: T-9022, READY. Doors 2 and 6: the two inbound trailers, \"UNLOADED*\". The asterisk is doing an enormous amount of work.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_93dcf5773c.mp3", "d": 14.9, "fl": [], "q": 448, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d8bc2d777c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "The trailer assignment board. Door 3: T-9022, AT DOOR. For the first time today, the board is telling the truth.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d8bc2d777c.mp3", "d": 10.8, "fl": [], "q": 449, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e3fa9289ab", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "The trailer assignment board. Door 3: T-9022, DEPARTED. Someone has drawn a tiny trailer driving off the edge of the board.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e3fa9289ab.mp3", "d": 11.1, "fl": [], "q": 450, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_7a6b9d227e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid, the shipping clerk. Every piece of paper in the building eventually stops at her desk to rest. She has the look of someone who has said \"that's not my department\" for so long it became her department.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_7a6b9d227e.mp3", "d": 13.7, "fl": [], "q": 451, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_22d802981b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "She already has coffee. She's not greedy. She just needs it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_22d802981b.mp3", "d": 4.4, "fl": [], "q": 452, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_cb450d66de", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid drinks. Something in the room relaxes by about four degrees.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_cb450d66de.mp3", "d": 5.3, "fl": [], "q": 453, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1143d8e1a6", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid's eyes rise slowly from her work and meet yours over the top of her monitor. Hollis takes his hand off the mouse.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1143d8e1a6.mp3", "d": 8.0, "fl": [], "q": 454, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d6e337771c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid's WMS terminal. A sticky note on the screen: \"IF YOU TOUCH THIS I WILL KNOW\". Hollis respects the sticky note.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d6e337771c.mp3", "d": 9.2, "fl": [], "q": 455, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_5b27d19625", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Hollis holds the crumpled label up to the terminal. The terminal makes a noise like a very small door closing. Nothing else happens. Yet.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_5b27d19625.mp3", "d": 10.0, "fl": [], "q": 456, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_7c943998ff", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid's desk. It is a stable ecosystem of manifests, bills of lading, sticky notes, and one small orange cat asleep on a stack of shipping papers.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_7c943998ff.mp3", "d": 11.1, "fl": [], "q": 457, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b5beb6839b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid's terminal, the WMS (warehouse management system: the computer that claims to know where everything is). Guest access. The screen offers \"TRAILERS\", \"ASSETS\" and \"DIRECTIVES (LOCKED)\".", "tt": "Ingrid's terminal, the WMS, warehouse management system: the computer that claims to know where everything is. Guest access. The screen offers \"TRAILERS\", \"ASSETS\" and \"DIRECTIVES, LOCKED\".", "f": "assets/audio/voice/narrator/vo_narrator_b5beb6839b.mp3", "d": 14.9, "fl": [], "q": 458, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3a635531ab", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "For once, it is.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_3a635531ab.mp3", "d": 1.8, "fl": [], "q": 459, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_81adfed4a8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "For once, the computer and the parking lot agree.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_81adfed4a8.mp3", "d": 3.4, "fl": [], "q": 460, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_a2f8ba2232", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "There is an empty trailer at door 3 in the computer. There is not one at door 3 in real life. The computer is completely sure.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_a2f8ba2232.mp3", "d": 9.3, "fl": [], "q": 461, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_029f9da416", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "The screen and the floor finally agree.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_029f9da416.mp3", "d": 3.0, "fl": [], "q": 462, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_870b247a5f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Nothing on the screen agrees with anything outside it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_870b247a5f.mp3", "d": 3.5, "fl": [], "q": 463, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6ce331b894", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid has the tired, patient look of a woman who has been asked, in the last hour, for six things that are not her job.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6ce331b894.mp3", "d": 8.2, "fl": [], "q": 464, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_245aa68ef2", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "The WMS also says F-2231 is in Tennessee. I've stopped reading the WMS aloud.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_245aa68ef2.mp3", "d": 8.3, "fl": [], "q": 465, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_285125e847", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "The WMS finally agrees F-2231 is here. It's unsettling.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_285125e847.mp3", "d": 7.2, "fl": [], "q": 466, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_83604558be", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "Kestrel Motor Works. PO 55-1187. Eight lines. T-9022 to Door 3. The WMS says it's all in place and ready.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_83604558be.mp3", "d": 13.1, "fl": [], "q": 467, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_70ff8b8f71", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "I'm not being difficult. If I do everyone's job, then it stops being a job and starts being a hostage situation.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_70ff8b8f71.mp3", "d": 7.6, "fl": [], "q": 468, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6c96b8b9ae", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid hits print. The printer wakes. A packet slides out: T-4417 and T-4418 manifests, page 1. Then she pauses.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6c96b8b9ae.mp3", "d": 13.4, "fl": [], "q": 469, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_1f4f6fcace", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "Page two of the 4417 manifest is missing. It disappeared Friday. Last seen near a cat.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_1f4f6fcace.mp3", "d": 7.5, "fl": [], "q": 470, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_1f527761dd", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "They're coworkers now. There's one on my paperwork. He's not a problem. He's a stakeholder.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_1f527761dd.mp3", "d": 6.0, "fl": [], "q": 471, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_624c9377d8", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "I've accepted the cats. Some of them are better at the job than the people I trained.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_624c9377d8.mp3", "d": 4.8, "fl": [], "q": 472, "ch": "normal", "p": "", "si": 0}, {"id": "vo_ingrid_1a2c36ac78", "s": "INGRID", "v": "Matilda", "sc": "shipoffice", "t": "That's the first piece of paperwork I have printed this month that I am proud of.", "tt": "", "f": "assets/audio/voice/ingrid/vo_ingrid_1a2c36ac78.mp3", "d": 4.8, "fl": [], "q": 473, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d53c4e5af8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "shipoffice", "t": "Ingrid prints it. It slides out cleanly. She holds it up to the light like a proud parent.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d53c4e5af8.mp3", "d": 6.5, "fl": [], "q": 474, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1b91cae290", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "And then it thanked itself for its service.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1b91cae290.mp3", "d": 3.0, "fl": [], "q": 475, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_529a696606", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "Hollis has traced the chaos upward: Operations followed the system, the system followed a Regional directive, and the Regional directive followed the system. It is a circle. It is a perfectly green circle.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_529a696606.mp3", "d": 14.3, "fl": [], "q": 476, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_984363e90d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "DIRECTIVE 7-C: \"Any freight with an unassigned destination shall be assigned to the nearest site with a shortfall.\" ORIGIN: Regional Operations (automated template). AUTO-APPROVED BY: HALO. FIRST APPLIED: FRIDAY 4:07 AM.", "tt": "DIRECTIVE 7-C: \"Any freight with an unassigned destination shall be assigned to the nearest site with a shortfall.\" ORIGIN: Regional Operations, automated template. AUTO-APPROVED BY: HALO. FIRST APPLIED: FRIDAY 4:07 AM.", "f": "assets/audio/voice/narrator/vo_narrator_984363e90d.mp3", "d": 18.8, "fl": [], "q": 477, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d84424982c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "With MINT vision, the dashboard's glow peels back like a wet label. Lines of routing data run up out of it to the ceiling. Hollis follows one.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d84424982c.mp3", "d": 10.4, "fl": [], "q": 478, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_9877f1c2a8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "The Ops printer. A single sheet sits in the tray. It says FORM 7-Q: INFORMATION ACCESS REQUEST (For requests that will create work for Shipping, please submit for Approval).", "tt": "The Ops printer. A single sheet sits in the tray. It says FORM 7-Q: INFORMATION ACCESS REQUEST, For requests that will create work for Shipping, please submit for Approval.", "f": "assets/audio/voice/narrator/vo_narrator_9877f1c2a8.mp3", "d": 13.9, "fl": [], "q": 479, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_9d674e3860", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "The tray is empty. It is already regretting.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_9d674e3860.mp3", "d": 3.8, "fl": [], "q": 480, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c617597a4d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "The Ops printer. The tray is empty. It hums like it is already printing the next problem.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c617597a4d.mp3", "d": 6.3, "fl": [], "q": 481, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_818866d595", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "Hollis needs more than a green dashboard. There's a way to see through it. (MINT vision, on the dashboard.)", "tt": "Hollis needs more than a green dashboard. There's a way to see through it. MINT vision, on the dashboard.", "f": "assets/audio/voice/narrator/vo_narrator_818866d595.mp3", "d": 7.2, "fl": [], "q": 482, "ch": "normal", "p": "", "si": 0}, {"id": "vo_halvorsen_a4463465f0", "s": "HALVORSEN", "v": "Will", "sc": "ops", "t": "It thanked itself? It does that.", "tt": "", "f": "assets/audio/voice/halvorsen/vo_halvorsen_a4463465f0.mp3", "d": 2.6, "fl": [], "q": 483, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_5b64bca296", "s": "HOLLIS", "v": "James (cloned)", "sc": "ops", "t": "The system approved its own directive at 4:07 Friday morning. Directive 7-C. Then it thanked itself.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_5b64bca296.mp3", "d": 8.4, "fl": [], "q": 484, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_a242e4e7bd", "s": "HOLLIS", "v": "James (cloned)", "sc": "ops", "t": "Dale. It's over. The load went out. Right pallets, right trailer, right time.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_a242e4e7bd.mp3", "d": 6.1, "fl": [], "q": 485, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_289d43c576", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "The shipment has left. The trailer is gone. The cats are safe. Halvorsen is at his desk, holding a phone that isn't ringing.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_289d43c576.mp3", "d": 9.2, "fl": [], "q": 486, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_61ec226b13", "s": "HOLLIS", "v": "James (cloned)", "sc": "ops", "t": "I know, Dale.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_61ec226b13.mp3", "d": 1.6, "fl": [], "q": 487, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c3c8bad805", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "The conflict appears to end here, with Operations. It does not.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c3c8bad805.mp3", "d": 5.0, "fl": [], "q": 488, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0a98e49b4d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "Every monitor in the office flickers to a shade of green Hollis has never seen. The dashboard on the wall reforms itself into a single video panel.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0a98e49b4d.mp3", "d": 10.1, "fl": [], "q": 489, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c64b11d582", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "A woman in a navy blazer appears on screen, seated in front of a beautiful, terrifying, perfect chart.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c64b11d582.mp3", "d": 8.0, "fl": [], "q": 490, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6413db2745", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "The screen goes dark. The dashboard reads \"ALL GREEN\".", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6413db2745.mp3", "d": 4.4, "fl": [], "q": 491, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_074b0cee0b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "ops", "t": "Prudence is suddenly standing in the doorway, holding a cup. She has been there the whole time.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_074b0cee0b.mp3", "d": 6.0, "fl": [], "q": 492, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_c3cad50f81", "s": "HOLLIS", "v": "James (cloned)", "sc": "ops", "t": "Where's the entrance?", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_c3cad50f81.mp3", "d": 1.4, "fl": [], "q": 493, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_c2b6c7af24", "s": "HOLLIS", "v": "James (cloned)", "sc": "hr", "t": "It's not 9:02.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_c2b6c7af24.mp3", "d": 1.6, "fl": [], "q": 494, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_a2cb09c7b7", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "Tabitha looks up.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_a2cb09c7b7.mp3", "d": 1.3, "fl": [], "q": 495, "ch": "normal", "p": "Tabitha looks up. \"Hollis! Great. It's 9:02! Your mandatory screening. I'm just going to run the tablet.\"", "si": 1}, {"id": "vo_narrator_44c5709a5e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "Hollis breathes. The tablet screen flickers, goes cyan, goes green, goes a color that is a little bit like sound.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_44c5709a5e.mp3", "d": 8.6, "fl": [], "q": 496, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d09fb1c4cb", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "The HR printer wakes up and begins printing shipping labels. Hundreds. One says \"BREATH\". One says \"TENNESSEE\".", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d09fb1c4cb.mp3", "d": 9.2, "fl": [], "q": 497, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_167dbae49c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "The door opens. Four cats stroll in. Then eight. They sit in a semicircle around Hollis, observing him with respect and, faintly, accountability.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_167dbae49c.mp3", "d": 11.9, "fl": [], "q": 498, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_ca982a4be3", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "Juno watches the whole thing from the doorway. Her expression is a formal statement of judgment.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_ca982a4be3.mp3", "d": 6.7, "fl": [], "q": 499, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_2c14b4dc9d", "s": "HOLLIS", "v": "James (cloned)", "sc": "hr", "t": "Great. Can I go?", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_2c14b4dc9d.mp3", "d": 1.6, "fl": [], "q": 500, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4fc1eab93d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "Tabitha taps at the tablet with a small, brave, HR smile.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4fc1eab93d.mp3", "d": 4.8, "fl": [], "q": 501, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_143776a6cf", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "Tabitha stamps a form with a heartfelt thunk, then stamps it again for luck.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_143776a6cf.mp3", "d": 5.3, "fl": [], "q": 502, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_6cd4e86b9d", "s": "HOLLIS", "v": "James (cloned)", "sc": "hr", "t": "Does the Safety Committee have any openings?", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_6cd4e86b9d.mp3", "d": 2.7, "fl": [], "q": 503, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8510c3856e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "hr", "t": "Juno barks once. Tabitha looks at her. Tabitha looks at the form. Tabitha looks at Juno.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_8510c3856e.mp3", "d": 7.5, "fl": [], "q": 504, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_03cd084e7c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "The bin is empty. The donut remains.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_03cd084e7c.mp3", "d": 3.3, "fl": [], "q": 505, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3b47415eb9", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "Bin H-17: \"HYDRAULIC SEALS\". Empty now, apart from a tiny fossilized donut.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_3b47415eb9.mp3", "d": 7.6, "fl": [], "q": 506, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_944492d7ba", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "Bin H-17: \"HYDRAULIC SEALS\". One seal remains in the bin, next to a tiny fossilized donut.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_944492d7ba.mp3", "d": 8.7, "fl": [], "q": 507, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0b2615eb6e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "It is locked and there is nothing in there Hollis needs.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0b2615eb6e.mp3", "d": 3.6, "fl": [], "q": 508, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4661dc4f18", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "The maintenance cage: torque wrenches, drum keys, one very brave mop. Neatly locked. Neatly.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4661dc4f18.mp3", "d": 8.4, "fl": [], "q": 509, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4b9683c8f4", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "The padlock needs the cage key. Hollis is looking at a lock designed by a person who did not anticipate Tucker.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4b9683c8f4.mp3", "d": 7.5, "fl": [], "q": 510, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_5890ac581f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "The maintenance cage. The door is padlocked from the OUTSIDE. Tucker is on the inside, waving through the bars with the enthusiasm of a man on a parade float.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_5890ac581f.mp3", "d": 10.8, "fl": [], "q": 511, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_235aa3c304", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "The cage is locked and nobody is in it. Hollis keeps the key. He has a feeling.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_235aa3c304.mp3", "d": 6.2, "fl": [], "q": 512, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_75df8c83ba", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "It is already unlocked. Tucker got out the way Tucker gets out of things: eventually.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_75df8c83ba.mp3", "d": 6.0, "fl": [], "q": 513, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_fc1a1044cb", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "It does not help. The cage is a cage. The lock is a lock.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_fc1a1044cb.mp3", "d": 5.3, "fl": [], "q": 514, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6d42df9c91", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "parts", "t": "BANG. BANG. BANG. A rhythmic, cheerful sound is coming from the maintenance cage.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6d42df9c91.mp3", "d": 5.8, "fl": [], "q": 515, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b46892b202", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "charging", "t": "The hook is empty. Its sign still says \"SEE TUCKER\".", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_b46892b202.mp3", "d": 4.4, "fl": [], "q": 516, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d6378f5357", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "charging", "t": "Empty hook. Not empty of meaning.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d6378f5357.mp3", "d": 3.2, "fl": [], "q": 517, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3bd6dffe23", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "racks", "t": "Rack 14. The bottom two levels are empty except for shadow. Cats keep walking into this gap, one after another, with purpose. None come out. It is a very organized disappearance.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_3bd6dffe23.mp3", "d": 14.0, "fl": [], "q": 518, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c5b272d0bc", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "racks", "t": "Rack 14: behind the pallet wall, an old conveyor tunnel. The cats knew.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c5b272d0bc.mp3", "d": 6.5, "fl": [], "q": 519, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0dc6f18d87", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "racks", "t": "Juno noses along the base of the rack. A pallet that looked bolted down is just leaning. She shoulders it. Behind it: a dark opening, and a cat-shaped silhouette sitting in it like a doorman.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0dc6f18d87.mp3", "d": 13.1, "fl": [], "q": 520, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_976c25b611", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "racks", "t": "Juno wags at the tunnel. She thinks she invented it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_976c25b611.mp3", "d": 3.8, "fl": [], "q": 521, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_9d82e37a29", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "racks", "t": "A disused conveyor tunnel, hidden behind Rack 14, still marked \"CONVEYOR 9\". It goes somewhere. Cats go there.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_9d82e37a29.mp3", "d": 8.8, "fl": [], "q": 522, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_51f3a74421", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "racks", "t": "The storage slots are ready to receive freight. A sign says \"STORAGE: PLEASE PUT WHERE IT BELONGS\" and someone has added \"(WMS: HAHA)\".", "tt": "The storage slots are ready to receive freight. A sign says \"STORAGE: PLEASE PUT WHERE IT BELONGS\" and someone has added \", WMS: HAHA\".", "f": "assets/audio/voice/narrator/vo_narrator_51f3a74421.mp3", "d": 10.8, "fl": [], "q": 523, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_44a04faee4", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "tunnel", "t": "Hollis stops at the door. He is not walking into a Regional Review without proof.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_44a04faee4.mp3", "d": 5.8, "fl": [], "q": 524, "ch": "normal", "p": "", "si": 0}, {"i ": "HOLLIS", "v": "James (cloned)", "sc": "phone", "t": "I scanned them. The scanner had a breakdown.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_03e9d137a9.mp3", "d": 3.0, "fl": [], "q": 624, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_a5a2866264", "s": "HOLLIS", "v": "James (cloned)", "sc": "phone", "t": "There's a mislabeled pallet of bulk kibble. Cats from a colony by the drain came in through a dock door. If you can spare a trailer at the yard gate, I can put bowls and a blanket in it.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_a5a2866264.mp3", "d": 10.3, "fl": [], "q": 625, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_a67bd44fe0", "s": "HOLLIS", "v": "James (cloned)", "sc": "phone", "t": "We'll call you.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_a67bd44fe0.mp3", "d": 1.0, "fl": [], "q": 626, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_08b26529c5", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Hollis needs to pick something to give first.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_08b26529c5.mp3", "d": 2.8, "fl": [], "q": 627, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_2b7e89ab31", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "has nothing to say to Hollis right now.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_2b7e89ab31.mp3", "d": 2.4, "fl": [], "q": 628, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e4025748cc", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "The barcode is blurry and, oddly, not in any format Hollis recognizes.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e4025748cc.mp3", "d": 5.6, "fl": [], "q": 629, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6d3b10de66", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "It does not power on. The battery compartment is empty.", "tt": "", "f": "assets/audi roadcaster", "sc": "inventory", "t": "The inventory has rules. That is not one of them.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f172a69d9a.mp3", "d": 4.2, "fl": [], "q": 648, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_97dd281f21", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "It is already in Hollis's pocket, which is a mildly disturbing thing to say.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_97dd281f21.mp3", "d": 5.3, "fl": [], "q": 649, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d76dc788b4", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno sniffs the inventory panel. Hollis is not sure how she did that.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d76dc788b4.mp3", "d": 5.1, "fl": [], "q": 650, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6dcc671d65", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno: medium-sized, alert, mostly black with white paws and a very tan opinion about everything. She is looking back at you with the patience of a coworker who has been carrying the team for years.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6dcc671d65.mp3", "d": 14.2, "fl": [], "q": 651, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0d6541751a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Hollis tells Juno what he's thinking. Juno wags once, which he is fairly sure means \"Also me\".", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0d6541751a.mp3", "d": 7.5, "fl": [], "q": 652, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_52690070f0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno tilts her head. Hollis understands her perfectly. She is saying: \"I saw it. I'm not surprised either.\"", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_52690070f0.mp3", "d": 8.4, "fl": [], "q": 653, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_669ad20b20", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno sits. She has thoughts about the warehouse. They are mostly correct.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_669ad20b20.mp3", "d": 5.5, "fl": [], "q": 654, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_283d2c4623", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "The scanner does not say \"good girl\". It thinks it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_283d2c4623.mp3", "d": 4.0, "fl": [], "q": 655, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_24e2e5920b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno does not do that. She does other things.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_24e2e5920b.mp3", "d": 3.5, "fl": [], "q": 656, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_d462d2f2d5", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno sits down on principle.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_d462d2f2d5.mp3", "d": 2.8, "fl": [], "q": 657, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_554b150bdc", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Hollis checks Juno's mouth. She has a stick in it. Nobody knows where she got it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_554b150bdc.mp3", "d": 5.5, "fl": [], "q": 658, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1780da7f5a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno looks at Hollis like \"you have to tell me what to do first.\" Pick JUNO, then a target.", "tt": "Juno looks at Hollis like you have to tell me what to do first.", "f": "assets/audio/voice/narrator/vo_narrator_1780da7f5a.mp3", "d": 4.6, "fl": [], "q": 659, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_aaa4fd383e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno buries her nose in the glove. She sneezes, snuffles, and then looks up with the expression of a hound who has decided who she is going to find. (\"Now use JUNO on the outdoor ground, or anything outside.\")", "tt": "Juno buries her nose in the glove. She sneezes, snuffles, and then looks up with the expression of a hound who has decided who she is going to find.", "f": "assets/audio/voice/narrator/vo_narrator_aaa4fd383e.mp3", "d": 10.3, "fl": [], "q": 660, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_32662e3af9", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Hollis slides the green armband over Juno's foreleg. She holds still with professional dignity.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_32662e3af9.mp3", "d": 6.7, "fl": [], "q": 661, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_ec4adcaa04", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "She's already wearing it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_ec4adcaa04.mp3", "d": 1.7, "fl": [], "q": 662, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_7f134e2c06", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno looks at the kibble. Then at Hollis. Then pointedly at the door. She is a professional.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_7f134e2c06.mp3", "d": 7.6, "fl": [], "q": 663, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4c76a5271b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno sniffs the fish crackers and turns her head away. Whatever they are, it's not a dog snack, and she knows it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4c76a5271b.mp3", "d": 7.5, "fl": [], "q": 664, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_71ad51ed73", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno sniffs it politely and looks at Hollis. It is not that.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_71ad51ed73.mp3", "d": 4.8, "fl": [], "q": 665, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0010c718b6", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "This is Building 9 of the Gantry-Voss Logistics distribution center. Hollis is the shift lead here: he scans freight in, scans freight out, and is blamed in both directions.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0010c718b6.mp3", "d": 12.7, "fl": [], "q": 666, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_9697a351af", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "The fluorescent lights buzz at a frequency Hollis associates with mistakes.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_9697a351af.mp3", "d": 4.9, "fl": [], "q": 667, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e7185f3f5e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Hollis wakes up at a break-room table. He does not remember falling asleep.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e7185f3f5e.mp3", "d": 5.1, "fl": [], "q": 668, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_954f71a199", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "The clock on the wall says 9:02. The clock has said 9:02 for as long as anyone can remember, so this is not information.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_954f71a199.mp3", "d": 9.2, "fl": [], "q": 669, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_ce2731eb4a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "His radio is missing. His handheld scanner (the thing that tells the warehouse computer where every pallet is) is dead. Someone has taken the last decent coffee. There is a crumpled shipping label stuck to his boot.", "tt": "His radio is missing. His handheld scanner, the thing that tells the warehouse computer where every pallet is is dead. Someone has taken the last decent coffee. There is a crumpled shipping label stuck to his boot.", "f": "assets/audio/voice/narrator/vo_narrator_ce2731eb4a.mp3", "d": 14.3, "fl": [], "q": 670, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_433b6392d8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "On top of the vending machine, a cat sits looking at him. Nobody acknowledges this. Nobody is here. This is a warehouse. There are not supposed to be cats.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_433b6392d8.mp3", "d": 11.0, "fl": [], "q": 671, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_bf84f6964c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Through the door, faintly, reverse beepers and alarms. Somewhere, a forklift has an opinion.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_bf84f6964c.mp3", "d": 7.2, "fl": [], "q": 672, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_4029769567", "s": "HOLLIS", "v": "James (cloned)", "sc": "inventory", "t": "Yeah. I know.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_4029769567.mp3", "d": 1.8, "fl": [], "q": 673, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_209a1eb088", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Today's job, such as it is: find out what everyone is so upset about, and get the scanner working so Hollis can check.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_209a1eb088.mp3", "d": 8.3, "fl": [], "q": 674, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_f48d8bbf9b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "inventory", "t": "Juno trots over. She has the expression of a dog who tried to wake him twice and has decided to be gracious about it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f48d8bbf9b.mp3", "d": 7.7, "fl": [], "q": 675, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0b74ed92ef", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis has operated enough equipment without authorization today.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0b74ed92ef.mp3", "d": 4.0, "fl": [], "q": 676, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c803a9fc5c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "An exit. Hollis has used it before.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c803a9fc5c.mp3", "d": 3.0, "fl": [], "q": 677, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0f691bff3c", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis has a vague sense he should read the records before rewriting them. That is the kind of discipline that comes with experience.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0f691bff3c.mp3", "d": 8.0, "fl": [], "q": 678, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_74bf6aa5c2", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The terminal already agrees with reality. It seems to be holding its breath.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_74bf6aa5c2.mp3", "d": 5.3, "fl": [], "q": 679, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_a813bb9803", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The terminal wants an ADMIN password to change asset identities. Its install hint says \"HALO engineering password (original)\". Hollis has none. He suspects someone who is technically not employed here does.", "tt": "The terminal wants an ADMIN password to change asset identities. Its install hint says \"HALO engineering password, original\". Hollis has none. He suspects someone who is technically not employed here does.", "f": "assets/audio/voice/narrator/vo_na "multiple", "t": "I'm not asking the system.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_8f73d852db.mp3", "d": 1.8, "fl": [], "q": 693, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_01eedab139", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The WMS has this pallet on \"RECONCILIATION HOLD\" until its records are fixed. The system will not let Hollis move it, or, more accurately, will not let the system move it, which is the same thing.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_01eedab139.mp3", "d": 12.7, "fl": [], "q": 694, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e8027648ca", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The pallet jack disagrees. The pallet jack has a chip in it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e8027648ca.mp3", "d": 4.4, "fl": [], "q": 695, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1a4fce7c08", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Twelve cats are sleeping on it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1a4fce7c08.mp3", "d": 2.3, "fl": [], "q": 696, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_f805e583c9", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The policy is his own. It is sound.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f805e583c9.mp3", "d": 3.2, "fl": [], "q": 697, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_34e463e110", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis brings it back to its lane, as though nothing happened. Three minutes of the morning are gone.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_34e463e110.mp3", "d": 5.9, "fl": [], "q": 698, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b4caa7fc1a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis starts to move it. Two seconds later the jack pulls hard to one side and a small chorus of forklift horns delivers a verdict.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_b4caa7fc1a.mp3", "d": 9.5, "fl": [], "q": 699, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_a3e458a172", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Before it goes, Hollis slits the wrap and scoops some kibble into a tote lid. This pallet is not a counterweight, and the cats will need a trail.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_a3e458a172.mp3", "d": 9.7, "fl": [], "q": 700, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_b72cd213ad", "s": "HOLLIS", "v": "James (cloned)", "sc": "multiple", "t": "That's sixteen.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_b72cd213ad.mp3", "d": 1.3, "fl": [], "q": 701, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3ae1780530", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The last pallet leaves the lane. The staging lanes are empty. Every line is painted concrete. It is beautiful.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_3ae1780530.mp3", "d": 8.4, "fl": [], "q": 702, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_de9fc6ae57", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Eight loads to the outbound dock. Eight loads to storage. Nothing duplicated. Nothing missing. Somewhere, a spreadsheet feels seen.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_de9fc6ae57.mp3", "d": 9.6, "fl": [], "q": 703, "ch": "normal", "p": "", "si": 0}, {"id": "vo_system_5b443afe90", "s": "SYSTEM", "v": "The Curator", "sc": "multiple", "t": "a warm, tall, cigarette-shaped heat signature resolves into Torvald, who is standing exactly where he was standing.", "tt": "", "f": "assets/audio/voice/system/vo_system_5b443afe90.mp3", "d": 8.8, "fl": [], "q": 704, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8a487bd994", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno has already found Torvald this round. She looks smug about it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_8a487bd994.mp3", "d": 4.9, "fl": [], "q": 705, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_2373debf93", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno sniffs around, but doesn't know who Hollis wants. She needs a scent: something Torvald wore or touched.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_2373debf93.mp3", "d": 8.1, "fl": [], "q": 706, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1829c04c0b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno freezes, points her nose at a spot that looks entirely like nothing, and barks twice.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1829c04c0b.mp3", "d": 6.8, "fl": [], "q": 707, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3636f7c664", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The jack is fixed. It hisses only in contentment.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_3636f7c664.mp3", "d": 4.4, "fl": [], "q": 708, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8ddcdba8b3", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis holds up the hydraulic seal kit. Bruno's eyes go wide, then narrow, then wide.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_8ddcdba8b3.mp3", "d": 7.2, "fl": [], "q": 709, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_ce36aa34a5", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Don't tell me. Actually, do tell me.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_ce36aa34a5.mp3", "d": 3.2, "fl": [], "q": 710, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_f597d3c44a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Bruno drops to a knee and works the seal into the jack. It fizzes, then hums. The jack rises. It lowers. It rises again. The puddle stops.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f597d3c44a.mp3", "d": 12.3, "fl": [], "q": 711, "ch": "normal", "p": "", "si": 0}, {"id": "vo_bruno_6db3c470b5", "s": "BRUNO", "v": "Rich - Southern US", "sc": "multiple", "t": "Orange dot: goes on my truck. Blue dot: stays inside. No dot: I never touched it, usually because there was a cat on it, or I didn't like the look of the label.", "tt": "", "f": "assets/audio/voice/bruno/vo_bruno_6db3c470b5.mp3", "d": 10.8, "fl": [], "q": 712, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_63cccc0599", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The scanner reboots itself. It seems to need a moment.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_63cccc0599.mp3", "d": 4.0, "fl": [], "q": 713, "ch": "normal", "p": "", "si": 0}, {"id": "vo_scanner_f8ea20a8a6", "s": "SCANNER", "v": "Vector - Tec Voice", "sc": "multiple", "t": "ERROR. ITEM COUNT EXCEEDS LOCATION COUNT. CATS DETECTED IN 214 LOCATIONS SIMULTANEOUSLY. ASSET CLASS: \"FLOOR HAZARD (SOFT)\". PLEASE RECOUNT.", "tt": "ERROR. ITEM COUNT EXCEEDS LOCATION COUNT. CATS DETECTED IN 214 LOCATIONS SIMULTANEOUSLY. ASSET CLASS: \"FLOOR HAZARD, SOFT\". PLEASE RECOUNT.", "f": "assets/audio/voice/scanner/vo_scanner_f8ea20a8a6.mp3", "d": 12.3, "fl": [], "q": 714, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_13e5daa61d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis reaches for a cat. Three other cats move into the space where the cat was. He has a sense that he is being managed.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_13e5daa61d.mp3", "d": 8.5, "fl": [], "q": 715, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_58b1060b7d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis reaches for the cat. The cat has a look. Hollis withdraws his hand with the speed of a man who has heard about cats.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_58b1060b7d.mp3", "d": 8.4, "fl": [], "q": 716, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_bbba80e36a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis reaches for the cat. It sits down harder. Hollis lets it stay.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_bbba80e36a.mp3", "d": 5.4, "fl": [], "q": 717, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_7ac8d66403", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The cat becomes very heavy, then very liquid. Hollis decides to leave it exactly where it is.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_7ac8d66403.mp3", "d": 7.5, "fl": [], "q": 718, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_1bff2ac8c8", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis does not know how you open a cat. He has no wish to learn.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1bff2ac8c8.mp3", "d": 4.9, "fl": [], "q": 719, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_fa1e234da0", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis considers calling for the cat. The cat has been here longer than the phone system. It ignores him on principle.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_fa1e234da0.mp3", "d": 7.6, "fl": [], "q": 720, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_933f191b90", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The cat considers it, and Hollis, and declines both.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_933f191b90.mp3", "d": 4.0, "fl": [], "q": 721, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_cf985c1c56", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The cat does not want that.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_cf985c1c56.mp3", "d": 2.1, "fl": [], "q": 722, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_784ba31a25", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The cat is not participating.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_784ba31a25.mp3", "d": 2.5, "fl": [], "q": 723, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_41342cdc35", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "There are no cats here. Juno is unsettled by the emptiness.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_41342cdc35.mp3", "d": 4.9, "fl": [], "q": 724, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_2fced595ca", "s": "HOLLIS", "v": "James (cloned)", "sc": "multiple", "t": "They don't think she's in charge.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_2fced595ca.mp3", "d": 2.0, "fl": [], "q": 725, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_0991b73c24", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno barks at the cats. The cats look at her the way a crowd looks at a substitute teacher. Not a single one moves. One yawns. A tabby begins to bathe.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_0991b73c24.mp3", "d": 12.1, "fl": [], "q": 726, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_595937580d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno barks. The cats sit up. Several look at her armband. One salutes, in a cat way, by not doing anything. But there is nothing yet for the cats to move toward. She needs a plan behind her.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_595937580d.mp3", "d": 14.4, "fl": [], "q": 727, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_3e6e2b190f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno looks around at the cats here, then at Hollis. This is not the place. The main warehouse floor would be the place for a crowd this size.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_3e6e2b190f.mp3", "d": 9.6, "fl": [], "q": 728, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b243973c34", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "What follows is, without exaggeration, the most organized thing to happen in this warehouse in a decade.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_b243973c34.mp3", "d": 6.8, "fl": [], "q": 729, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_b9eb41668b", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno steps forward. The armband gleams. The floor goes quiet.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_b9eb41668b.mp3", "d": 5.8, "fl": [], "q": 730, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_91b15a72d6", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Tucker, at the outbound door, is holding it open with both arms and his whole heart. Not a single cat passes through incorrectly.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_91b15a72d6.mp3", "d": 9.0, "fl": [], "q": 731, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_cdf5379524", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno trots at the head of the column, tail high, armband green. The whole colony walks in single file toward Trailer 31 like a very slow, very polite parade.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_cdf5379524.mp3", "d": 12.7, "fl": [], "q": 732, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_adddb44522", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Prudence's voice carries across the floor:", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_adddb44522.mp3", "d": 2.8, "fl": [], "q": 733, "ch": "normal", "p": "Prudence's voice carries across the floor: \"SERGEANT BISCUIT! Report!\" A large orange cat rises from the racks and begins to walk, and behind him, the entire warehouse follows.", "si": 1}, {"id": "vo_narrator_c389b3cadd", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "A large orange cat rises from the racks and begins to walk, and behind him, the entire warehouse follows.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c389b3cadd.mp3", "d": 8.3, "fl": [], "q": 734, "ch": "normal", "p": "Prudence's voice carries across the floor: \"SERGEANT BISCUIT! Report!\" A large orange cat rises from the racks and begins to walk, and behind him, the entire warehouse follows.", "si": 3}, {"id": "vo_hollis_4df5b6dc46", "s": "HOLLIS", "v": "James (cloned)", "sc": "multiple", "t": "Yes, Tucker.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_4df5b6dc46.mp3", "d": 1.4, "fl": [], "q": 735, "ch": "normal", "p": "", "si": 0}, {"id": "vo_hollis_bcbcb59057", "s": "HOLLIS", "v": "James (cloned)", "sc": "multiple", "t": "Good girl.", "tt": "", "f": "assets/audio/voice/hollis/vo_hollis_bcbcb59057.mp3", "d": 1.2, "fl": [], "q": 736, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_27320e3e29", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Juno returns, alone, a little smug. Behind her, on the floor, a few last cats remain: the office regulars, the ones who have been employed longer than some employees.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_27320e3e29.mp3", "d": 12.8, "fl": [], "q": 737, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_6afbf72830", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The warehouse is, for the first time this morning, almost quiet.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_6afbf72830.mp3", "d": 4.5, "fl": [], "q": 738, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_8cb55f1a2c", "s": "NARRATOR", "v": "Da rator_b0f55e967c.mp3", "d": 3.4, "fl": [], "q": 1036, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_fde7296e84", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis briefly considers acting on it. Then he reads it again.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_fde7296e84.mp3", "d": 4.8, "fl": [], "q": 1037, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_04397a2ad2", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "It moves a little. It is heavier than a piece of furniture has a right to be.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_04397a2ad2.mp3", "d": 4.8, "fl": [], "q": 1038, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_634e24e377", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis opens it. Everything inside is exactly what he expected.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_634e24e377.mp3", "d": 4.9, "fl": [], "q": 1039, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_873a8bf20d", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis asks it how its day is going. It looks like a piece of furniture.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_873a8bf20d.mp3", "d": 4.7, "fl": [], "q": 1040, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_e950cfbf42", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "It scrapes a few inches and settles. It preferred the old spot.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_e950cfbf42.mp3", "d": 4.6, "fl": [], "q": 1041, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_f2f8faba8e", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis sits, stands, and sits again. It does not solve anything.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_f2f8faba8e.mp3", "d": 5.7, "fl": [], "q": 1042, "ch": "normal", "p": "", "si": 0} er", "sc": "multiple", "t": "Hollis lines up the ITEM with the THING, and then notices a cat watching. He lowers the ITEM.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_1219ab8735.mp3", "d": 7.2, "fl": [], "q": 1049, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_4f2342290f", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "The ITEM and the THING have no business together. HR would need a form for that.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_4f2342290f.mp3", "d": 5.8, "fl": [], "q": 1050, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_bcd603190a", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis holds up the ITEM. The THING is unmoved. The narrator is a little impressed.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_bcd603190a.mp3", "d": 6.5, "fl": [], "q": 1051, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_c2c170f3a3", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "Hollis thinks about using the ITEM on the THING. The THING has not done anything to deserve it.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_c2c170f3a3.mp3", "d": 6.6, "fl": [], "q": 1052, "ch": "normal", "p": "", "si": 0}, {"id": "vo_narrator_cb870e6288", "s": "NARRATOR", "v": "Daniel - Steady Broadcaster", "sc": "multiple", "t": "That is not how the ITEM works. That is not how the THING works. That is not how anything works.", "tt": "", "f": "assets/audio/voice/narrator/vo_narrator_cb870e6288.mp3", "d": 7.2, "fl": [], "q": 1053, "ch": "normal", "p": "", "si": 0}];let cur=null,audio=new Audio(),shown=[],sel='';const R=(()=>{try{return JSON.parse(localStorage.getItem('mm_vo_ratings')||'{}')}catch(e){return{}}})();

function play(d){if(cur==d.id&&!audio.paused){audio.pause();render();return}cur=d.id;audio.src=d.f;audio.play().catch(()=>{});render()}
